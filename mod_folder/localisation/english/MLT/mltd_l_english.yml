  ### Tridents: MLT's name for Heavy Melee Weaponry (melee_weaponry_tech_3 / melee_equipment_3), the way OWB's MLT_melee_equipment_2 is its Conch Knife; icon GFX_MLT_melee_weaponry_tech_3_medium (interface/mltd.gfx)
  MLT_melee_equipment_3:0 "Tridents"
  MLT_melee_equipment_3_short:0 "Tridents"
  MLT_melee_equipment_3_desc:0 "The tribe has always fished with the spear, and what pins a catch to the mud will pin a man to it. The smiths of the Coral Court bind three tines of salvaged ship-steel to a long haft, barb them like a mirelurk's claw, and wrap the grip in kelp cord that does not slip when wet. A trident keeps an armoured enemy at the end of the pole, finds the joints in his plate and does not let go - and in the shallows, where the tribe likes to fight, there is nothing better for holding a man under."
