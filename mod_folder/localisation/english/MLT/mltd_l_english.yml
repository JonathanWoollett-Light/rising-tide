  ### Books of M'lyeh, gift unlocks, events mltd.7-8
  mltd.7.t:0 "$mltd_call_of_the_deep_ones$"
  mltd.7.d:0 "At the turning of the tide the drums fell silent, and in the silence [358.GetName] heard the answer. They came up through the shallows in long grey ranks - slick-skinned, unblinking, cold as the trench they were called out of - and knelt in the surf before the coral gates. The oracles say these are no hatchlings of any spawning pool but the elder children of §oM'lyeh§!, who wore the shapes of men once and gave them back to the sea. §o[MLT_MLULU.GetName]§! has called them by name, and they have come to be counted in her host. The tribe already knows what to call them. The coast will learn: the §c$mltd_deep_ones$§!."
  mltd.7.a:0 "They rise at her word."
  mltd.8.t:0 "$mltd_the_deep_ones_walk$"
  mltd.8.d:0 "They wait for no summons now. At dusk they walk up out of the surf, in numbers the oracles no longer tally, and take their places in the queen's ranks as though they had always stood there. Along the coast the villages have stopped lighting their night-fires, for fear of what the light might show. And behind the grey ranks, where the water is deepest and the fog will not lift, something else has begun to stir - vaster than any Deep One, older than the sea that hides it, come down out of the sky when the world was young. §o[MLT_MLULU.GetName]§! has spoken its name into the dark, and the first of the §c$mltd_star_spawn$§! has opened one eye."
  mltd.8.a:0 "Let the coast learn to fear the dusk."
  mltd_first_book:0 "The Book of the Tide"
  mltd_first_book_desc:0 "The first of the five Books of M'lyeh lies where [DIS.GetNameDef] kept it, beneath the altar-stone at §Y[150.GetName]§!: a slab of black coral grown over with a script that wets itself to be read. It speaks of the ebb and of the flood, and of what the water carries back to those who feed it."
  mltd_second_book:0 "The Book of the Shell"
  mltd_second_book_desc:0 "The second Book was dragged down into the burrows of §Y[235.GetName]§! long ago and gnawed at by things that could not read it. What remains is scratched onto plates of carapace nested one inside the next, and the innermost plate is still warm to the touch."
  mltd_third_book:0 "The Book of the Current"
  mltd_third_book_desc:0 "The third Book waits at the bottom of §Y[231.GetName]§!, where [MDT.GetNameDef] cast it, and the pit has whispered to them every night since. It tells of a current that runs beneath all other currents, and of how a thousand minds may be turned by it as one."
  mltd_fourth_book:0 "The Book of the Brood"
  mltd_fourth_book_desc:0 "The fourth Book was never lost. The elders of §Y[337.GetName]§! have read from it for two hundred years and called it scripture, never once looking closely at the spawning pools it describes, nor at the shapes their children have lately begun to take."
  mltd_fifth_book:0 "The Book of the Abyss"
  mltd_fifth_book_desc:0 "The last Book has no pages. It is the thing that sits in the drowned harbour at §Y[274.GetName]§!, and Port Maw's people have built their city around it without ever asking what it is. To read it, §Y[MLT_MLULU.GetName]§! must go down to it herself - and what is read there cannot be unread."
  mltd_tide_gift_unlocked_tt:0 "Unlocks the §Y$mltd_gift_of_the_tide$§! decision."
  mltd_shell_gift_unlocked_tt:0 "Unlocks the §Y$mltd_gift_of_the_shell$§! decision."
  mltd_current_gift_unlocked_tt:0 "Unlocks the §Y$mltd_gift_of_the_current$§! decision."
  mltd_brood_gift_unlocked_tt:0 "Unlocks the §Y$mltd_gift_of_the_brood$§! decision."
  mltd_abyss_gift_unlocked_tt:0 "Unlocks the §Y$mltd_gift_of_the_abyss$§! decision."
  mltd_books_read_1_tt:0 "Requires at least §Y1§! Book of M'lyeh to have been read (§Y[?mltd_books_read|0]§! of 5 read)"
  mltd_books_read_3_tt:0 "Requires at least §Y3§! Books of M'lyeh to have been read (§Y[?mltd_books_read|0]§! of 5 read)"
  mltd_books_read_5_tt:0 "Requires all §Y5§! Books of M'lyeh to have been read (§Y[?mltd_books_read|0]§! of 5 read)"
  ### Characters
  MLT_DROWNED_HERALD_NAME:0 "The Drowned Herald"

  ### Round 8: dark event colours, manpower gift
  mltd_gift_manpower_grand_tt:0 "§Y$mltd_gifts_from_the_deep$§! now grants §G+20§! §HWeekly Manpower§!."
  mltd_gift_manpower_final_tt:0 "The §HWeekly Manpower§! granted by §Y$mltd_gifts_from_the_deep$§! is doubled to §G+40§!."
  ### Round 9: summon cooldowns, offerings, spawning pools, capital victory points
  mltd_summon_state_pop_deep_ones_tt:0 "The lands we still hold number more than §Y16,000§! - twice what the summoning takes"
  mltd_summon_state_pop_star_spawn_tt:0 "The lands we still hold number more than §Y32,000§! - twice what the summoning takes"
  mltd_deep_ones_summon_cooldown_tt:0 "The deep is sated. Days until the $mltd_deep_ones$ answer again: §Y[?mltd_deep_ones_summon_cooldown:days_left|0]§!"
  mltd_star_spawn_summon_cooldown_tt:0 "The stars are not yet right. Days until the $mltd_star_spawn$ answer again: §Y[?mltd_star_spawn_summon_cooldown:days_left|0]§!"
  mltd_deep_ones_summon_cooldown_after_tt:0 "The deep will not answer again for §Y90§! days"
  mltd_star_spawn_summon_cooldown_after_tt:0 "The stars will not be right again for §Y120§! days"
  mltd_deep_ones_summon_replaced_tt:0 "§G$mltd_summon_the_deep_ones$§! is retired - the $mltd_deep_ones$ can now be raised in the field, and the sea answers only to §G$mltd_summon_the_star_spawn$§!"
  mltd_offering_of_the_drowned:0 "The Drowned Hoard"
  mltd_offering_of_the_drowned_desc:0 "A thousand of the faithful walk out at low tide with stones in their arms, from whichever of our lands can spare them. The sea keeps them, and gives back what it took from every ship it ever swallowed - strongboxes, rings, and caps by the sackful, crusted and stinking of salt."
  mltd_offering_of_the_tides:0 "Drown the Fields"
  mltd_offering_of_the_tides_desc:0 "Fifteen hundred are given to the channel where the old river met the sea, and the water answers by rising. Fresh springs break open through the silt of §YM'lyeh§! and do not close again."
  mltd_offering_state_pop_3000_tt:0 "One of our states holds more than §Y3,000§! people to give"
  mltd_offering_drowned_cooldown_tt:0 "The sea has not finished counting its dead. Days until it will trade again: §Y[?mltd_offering_drowned_cooldown:days_left|0]§!"
  mltd_offering_drowned_cooldown_after_tt:0 "The sea will not trade again for §Y60§! days"
  mltd_offering_tides_cooldown_tt:0 "The channel is still swollen from the last offering. Days until it will rise again: §Y[?mltd_offering_tides_cooldown:days_left|0]§!"
  mltd_offering_tides_cooldown_after_tt:0 "The waters will not rise again for §Y180§! days"
  ### Round 10: Feed the Spawning Pools as a continuous focus
  mltd_continuous_spawning_pools:0 "§eFeed the Spawning Pools§!"
  mltd_continuous_spawning_pools_desc:0 "The brood pits under [358.GetName] are always hungry, and a hungry brood grows slowly. Drive the herds into the shallows, dredge the beds and keep the hatchlings gorged: a fat spawning is a cheap one. [GetMltdMirelurksName], $mltd_deep_ones$ and $mltd_star_spawn$ all cost less to raise for as long as the pits are kept full."
  continuous_mltd_spawning_pools:0 "$mltd_continuous_spawning_pools$"
  continuous_mltd_spawning_pools_desc:0 "The brood pits are kept swollen with meat all year round."
  ### Round 12: the summon toll falls on every state
  mltd_deep_ones_toll_tt:0 "§Y8,000§! people are taken from every state we control, each giving in proportion to what it holds"
  mltd_star_spawn_toll_tt:0 "§Y16,000§! people are taken from every state we control, each giving in proportion to what it holds"
  ### Conflict sub-trees: shared intelligence helper (mltd_intel_foothold)
  mltd_agency_name:0 "The Esoteric Order of M'lyeh"
  mltd_intel_foothold_upgrade_tt:0 "§Y[Root.GetAgency]§! gains one random agency upgrade, its cap cost refunded."
  ### Conflict sub-tree: the New California Republic
  mltd_ncr_a_mole_in_shady_sands:0 "A Mole in [253.GetName]"
  mltd_ncr_a_mole_in_shady_sands_desc:0 "[253.GetName] drinks from deep wells, and what is deep belongs to us. A salt-seller from the northern coast has taken a room above an [NCR.GetAdjective] records office, and the clerks buy his brine by the jar and carry a little of the sea home with them. He keeps no papers and needs none. At night he sits beside the old well-head with his ear to the stone, and the water tells him everything [NCR.GetNameDef] says above it. §Y$mltd_agency_name$§! has opened its first eye in the capital of [NCR.GetNameDef]."
  mltd_ncr_drowned_delegates:0 "Drowned Delegates"
  mltd_ncr_drowned_delegates_desc:0 "The senators of [NCR.GetNameDef] meet on §YCouncil Hill§! and argue themselves hoarse over water rights, tariffs and the war. Lately a few of them come from coastal districts where the fishing has been very good. They speak little, their collars are always damp, and they vote together. None of them can say when they began to dream of the drowned city; only that Congress feels terribly dry these days, and that a quiet word from the coast should always be heeded."
  mltd_ncr_sleepers_on_the_long_15:0 "Sleepers on the Long 15"
  mltd_ncr_sleepers_on_the_long_15_desc:0 "An army marching into the Mojave needs water more than it needs bullets, and [NCR.GetNameDef] will buy it from anyone with barrels and a brahmin to pull them. Our converts have taken the work. They roll brackish casks down the §YLong 15§! to the forward camps and sit with the troopers after dark, and they only ever talk about the river: how cold it runs below the dam, how patient it is, how it remembers everything that was ever built across it. The troopers laugh at first. Then they stop laughing and start to listen."
  mltd_ncr_salt_on_the_caravan_roads:0 "Salt on the Caravan Roads"
  mltd_ncr_salt_on_the_caravan_roads_desc:0 "[NCR.GetNameDefCap] lives on its caravans: long brahmin trains carrying rifles, medicine and caps to every outpost that flies the bear. When a train loses its way in the sea-fog on the coast road, nobody misses it for weeks, and the sea keeps whatever it takes. Our sleepers in the quartermasters' offices tell us which trains to lose. The tide does the rest, and the salvage comes home to §YM'lyeh§! crusted white with salt."
  mltd_ncr_the_turbines_sing:0 "The Turbines Sing"
  mltd_ncr_the_turbines_sing_desc:0 "Below §Y[252.GetName]§! the river is chained, and it has worn its chain for two hundred years. The old world poured a mountain of stone across its throat and set great wheels turning inside it. [NCR.GetNameDefCap] calls the noise of those wheels power. The Coral Court calls it a hymn, sung by a captive tide to what waits for it at the bottom of the sea. Our sleeper in the turbine hall has learned the song by heart, along with every drawing of the machines that sing it."
  mltd_ncr_delegates_crisis_tt:0 "§Y[NCR.GetNameDefCap] is already in crisis:§! a frightened Congress listens closely to wet voices."
  mltd_ncr_hoover_contested_tt:0 "The first §YBattle for [252.GetName]§! has been fought, §Y[CES.GetName]§! is marching on the dam a second time or is no more, or it is past §Y1 June 2279§!"
  mltd_ncr_turbines_rout_tt:0 "§Y[CES.GetName] has overrun the Mojave:§! our sleepers walk out among the routed columns of [NCR.GetNameDef] and bring back whatever they can carry."
  mltd_ncr_turbines_wall_tt:0 "§YThe Old World Wall held:§! our sleepers stood on it beside the troopers of [NCR.GetNameDef], and learned how a wall is held."
  mltd_ncr_turbines_second_battle_tt:0 "§Y[CES.GetName] marches on the dam again:§! in the turbine halls the whispers say the water is angry."
  ### Conflict sub-tree: Texas
  mltd_tex_all_waters_are_one:0 "All Waters Are One"
  mltd_tex_all_waters_are_one_desc:0 "Texas is a long way from [358.GetName], and a dry one. But the Gulf laps at its southern shore, and the Gulf is only the sea under another name; the brown rivers that wind up through the prairie to [892.GetName] and [921.GetName] still taste of salt. Whatever the sea touches, §Y[MLT_MLULU.GetName]§! hears. The Order sends its quiet pilgrims east along the old roads - peddlers, fishermen, a preacher who never seems to blink - to learn who holds the Texan plains, what they hoard, and what they fear in the dark."
  mltd_tex_the_silent_partner:0 "The Silent Partner"
  mltd_tex_the_silent_partner_desc:0 "[TBH.GetNameDefCap] and the lawmen of [LNS.GetName] have bound their fortunes together in the §Y$texan_economic_union$§!, and every union needs clerks. Ours keep the ledgers in a neat, damp hand, never ask for wages and never miss a meeting. They sit in the Union's counting-houses and listen. Now and then a column of figures does not quite add up, and the difference goes west on the tide."
  mltd_tex_wreckers_on_the_trinity:0 "Wreckers on the Trinity"
  mltd_tex_wreckers_on_the_trinity_desc:0 "After a hard rain the Trinity runs high and fast past the depots of Texas, and on those nights the supply barges founder where the channel is deepest. The crates are never found. The bargemen who swim ashore swear that something took hold of the hull from underneath and pulled. Rifles, powder, ration tins: the river takes whatever the Texans send down it, and the river answers to us."
  mltd_tex_black_water_rising:0 "Black Water Rising"
  mltd_tex_black_water_rising_desc:0 "However Texas is ruled now - a Republic under the Lone Star, one power standing on its rival's grave, or two partners still haggling over the Union's ledgers - its masters have done what every master of dry country does: they have started to dig. Their wells go deeper than any the old world sank, past the oil and the brine into a black water that is neither. Our clerks followed the ledgers to the well-heads, and now they keep those too. What rises in the night is sealed in drums and sent west, and the drillers who stare too long down the shafts begin to dream of a green-lit city under the sea. The black water beneath Texas and the black water beneath §YM'lyeh§! were always one water."
  mltd_tex_civilian_network_tt:0 "Our agents reach into the councils of Texas: we hold a §Ycivilian infiltration§! token against §Y[TBH.GetName]§! or §Y[LNS.GetName]§!, or our network covers more than §Y20%§! of either"
  mltd_tex_army_network_tt:0 "Our agents reach into the armouries of Texas: we hold an §Yarmy infiltration§! token against §Y[TBH.GetName]§! or §Y[LNS.GetName]§!, or our network covers more than §Y25%§! of either"
  mltd_tex_one_master_tt:0 "One of these holds: §YTexas§! has been united under one flag, §Y[TBH.GetName]§! or §Y[LNS.GetName]§! no longer exists, or the date is after §Y1 January 2280§!"
  mltd_tex_empty_armouries_tt:0 "Neither Texan armoury has §Y800§! rifles to spare: the wreckers bring back only salvage and gossip"
  mltd_tex_black_water:0 "Black Water"
  mltd_tex_black_water_desc:0 "Sealed drums come west by night from the wells of Texas, and what is inside them burns cold and bright in the forges of §YM'lyeh§!. No one who has opened one sleeps well afterwards."
  ### Conflict sub-tree: the Washington Brotherhood
  mltd_wbh_eyes_in_the_sound:0 "Eyes in the Sound"
  mltd_wbh_eyes_in_the_sound_desc:0 "North of [235.GetName] the land falls away into a grey sound full of drowned towers. On its far shore §Y[WBH.GetNameDef]§! hammers out its armour in a citadel of frozen steel among the ruins of §Y[84.GetName]§!. They call every mutant an abomination and have sworn to burn [235.GetName] clean, and [235.GetName] is ours now. Let them come. The water beneath their piers is ours too, and things with patient, lidless eyes have begun to gather in it to watch the Paladins drill."
  mltd_wbh_salt_in_the_citadel:0 "Heresy in the Citadel"
  mltd_wbh_salt_in_the_citadel_desc:0 "§Y[WBH_THE_IMMORTAL.GetName]§! suffers no mutant in his halls, but he keeps slaves, and slaves dream. Our oracles have found the ones who dream of green water and a city beneath it, and taught them what to murmur at the forges and in the barracks. Now the Inquisitors smell heresy in every corridor of the citadel, and the crusade spends its strength on the pyres of its own."
  mltd_wbh_the_drowned_knights:0 "The Drowned Knights"
  mltd_wbh_the_drowned_knights_desc:0 "Power armour does not float. Every Paladin who slips from a [84.GetName] pier, or rides a raft too far out over the Sound, goes straight to the bottom still sealed in his steel, and the deep keeps him. For months the $mltd_deep_ones$ have been dragging them up out of the silt: rust-black, crusted with barnacles, and filled with something that is no longer quite a man. Now these drowned knights walk back into [84.GetName] by night, through doors our friends in the armouries leave unbarred, and carry [WBH.GetAdjective] weapons down into the water."
  mltd_wbh_the_tide_wall:0 "The Tide-Wall of [235.GetName]"
  mltd_wbh_the_tide_wall_desc:0 "Sooner or later the [WBH.GetAdjective] crusade turns south, and §Y[235.GetName]§! lies first in its path. The burrows of the First are ours now, and we will not surrender them to men in steel. Coral is grown across the tunnel mouths, the lower galleries are flooded to the knee, and the drowned knights stand watch in the black water. Let the Paladins come down into [235.GetName]. The tide is waiting for them there."
  mltd_wbh_crusade_turns_tt:0 "§Y[WBH.GetNameDefCap]§! has completed §Y$WBH_eradicate_the_mutants$§!, is at war with us or is no more, or the year §Y2280§! has begun"
  mltd_wbh_tide_wall:0 "The Tide-Wall"
  mltd_wbh_tide_wall_desc:0 "The burrows of [235.GetName] are flooded, choked with coral and watched from beneath by the drowned. Any [WBH.GetAdjective] column that goes down into them learns what it is to fight in the dark, in cold water, against things that do not need to breathe."
  ### Conflict sub-tree: Caesar's Legion
  mltd_ces_what_the_river_carries:0 "What the River Carries"
  mltd_ces_what_the_river_carries_desc:0 "The Colorado runs down out of the lands of [CES.GetNameDef] and empties into the Sea of Cortez, and whatever reaches the sea belongs, in the end, to §Y[MLT_MLULU.GetName]§!. So the Coral Court sends its oracles upriver against the current, as salt-sellers, ferrymen and lepers no legionary cares to look at twice. They count the crosses along the roads to §Y[520.GetName]§!, the garrisons and the granaries, and at night they kneel at the water's edge and tell the river everything they have seen."
  mltd_ces_the_drowned_frumentarius:0 "The Drowned Frumentarius"
  mltd_ces_the_drowned_frumentarius_desc:0 "[CES_caesar.GetName]'s §Yfrumentarii§! are the finest spy-catchers in the wasteland, and they found our salt-sellers within a season. One of them followed an oracle down to the river at dusk to cut her throat, and was pulled under instead. Three days later he walked out of the shallows, dripping and perfectly calm, and went home to report to his masters. It was an excellent report, and every word of it came from the Coral Court. So will the next one."
  mltd_ces_the_chained_are_given_to_the_tide:0 "The Chained Are Given to the Tide"
  mltd_ces_the_chained_are_given_to_the_tide_desc:0 "[CES.GetNameDefCap] measures its wealth in chains, and the slave markets of §Y[520.GetName]§! will sell anything with a pulse to anyone with coin. Our buyers pay in river pearls and never haggle, and the long coffles they lead west never reach any market. At the coast half of the chained are walked into the surf, and this season the tribe need not give its own. The rest kneel in the shallows, feel the collar fall away, and rise as the faithful of §YM'lyeh§!."
  mltd_ces_salt_in_the_armouries:0 "A Crate for Every Cross"
  mltd_ces_salt_in_the_armouries_desc:0 "The drowned frumentarius knows which quartermasters drink, which gate-guards sleep and which supply wagons take the canyon road without an escort. Machetes and rifles, hammers and ammunition, vanish a crate at a time from the depots of [CES.GetNameDef] and surface weeks later on the black sand of [358.GetName], wrapped in kelp. For every missing crate [CES.GetNameDef] crucifies a guard. It never recovers the crates."
  mltd_ces_the_sea_against_mars:0 "The Sea Against Mars"
  mltd_ces_the_sea_against_mars_desc:0 "[CES_caesar.GetName] calls himself the §YSon of Mars§!, and his legions believe it. So our converts in the slave pens and the legionary camps whisper something else: that Mars is a small god, a dry god, a god who has never once looked upon the sea, and that no son of his will outlast the sickness eating at him in §Y[520.GetName]§!. If [CES_caesar.GetName] recovers, every legionary will wonder why his god needed the help. If he dies, his heirs will drown one another for his chair, and the river carries every one of the drowned down to §Y[MLT_MLULU.GetName]§!."
  mltd_ces_drowned_frumentarius_operative:0 "Silanus the Drowned"
  mltd_ces_chained_faithful_tt:0 "§G1,000§! of the chained are brought to §Y[MLT.Capital.GetName]§! and rise there as the faithful (§G+1,000§! population in our capital)"
  mltd_ces_chained_pens_full_tt:0 "[CES.GetName] has built its economy on chains and its pens are full: §G500§! more are brought to §Y[MLT.Capital.GetName]§!"
  mltd_ces_chained_nipton_tt:0 "Those who fled the massacre at §Y[47.GetName]§! went west, and our oracles met them on the road: §G500§! more are brought to §Y[MLT.Capital.GetName]§!"
  mltd_ces_mars_fallen_tt:0 "§Y[CES.GetName]§! is gone, and the river has already carried what was left of it to the sea:"
  mltd_ces_mars_dead_tt:0 "§Y[CES_caesar.GetName]§! no longer rules in §Y[520.GetName]§!, and Mars lifted no hand to save his son:"
  mltd_ces_mars_fever_tt:0 "In §Y[520.GetName]§! the §YSon of Mars§! lies sick, and the legions wonder why his god does not heal him:"
  mltd_ces_mars_hale_tt:0 "§Y[CES_caesar.GetName]§! is hale and §Y[520.GetName]§! gives thanks to Mars, but the whisper is patient:"
  mltd_ces_mars_cult_tt:0 "[CES.GetName] has sworn its ranks to the war-god himself, and every legionary who kneels at his altar now wonders whether Mars can swim:"
  mltd_ces_the_drowned_bull:0 "The Drowned Bull"
  mltd_ces_the_drowned_bull_desc:0 "Up and down the coast they tell how the golden bull of [CES.GetNameDef] was carried into the Colorado and never came up again. The tribe believes it. More to the point, so do the slaves of [CES.GetNameDef]."
  ### Conflict sub-tree: the Brotherhood of Steel (Lost Hills)
  mltd_bos_the_drowned_paladin:0 "The Drowned Paladin"
  mltd_bos_the_drowned_paladin_desc:0 "A [BOS.GetAdjective] patrol was lost at sea far to the south, and the currents carried one of its dead all the way to [358.GetName]: a Paladin, face down on the black sand, his power armour full of brine and small pale crabs. The suit's radio still hisses on the [BOS.GetAdjective] frequencies, and the steel-bound Codex chained to his belt is written in a cipher the Coral Court has never seen. §Y[MLT_MLULU.GetName]§! bids her oracles listen to the one and read the other. [BOS.GetNameDefCap] buries its secrets beneath the earth. The tribe keeps its own beneath the sea, where no one has ever thought to dig."
  mltd_bos_the_paladin_returns:0 "The Paladin Returns"
  mltd_bos_the_paladin_returns_desc:0 "Three weeks after he drowned, the Paladin walked back through the blast doors of §Y[BOS.GetName]§!, gave the countersign without a flaw and reported that nothing was wrong. He does not take off his helmet. He does not eat in the mess. At night the scribes who share his corridor dream of green water and a city of wrong angles, and some of them wake with words of the old tongue already in their mouths. The Elders have begun to hunt for a traitor. They are looking in the wrong direction."
  mltd_bos_the_tide_takes_the_armoury:0 "The Tide Takes the Armoury"
  mltd_bos_the_tide_takes_the_armoury_desc:0 "§Y[BOS.GetName]§! counts its laser rifles the way the faithful count the tides, and still the count comes up short. Crates vanish from the lower armoury between one inventory and the next. A convoy of power armour never arrives at all; its drivers are found a week later in a dry culvert, drowned in a place with no water. [BOS.GetNameDefCap] blames [NCR.GetNameDef]. The weapons go north by the old smugglers' roads, and the shallows of §YM'lyeh§! are full of them."
  mltd_bos_the_codex_unsealed:0 "The Codex Unsealed"
  mltd_bos_the_codex_unsealed_desc:0 "[BOS.GetNameDefCap] has spent two centuries hoarding what the old world knew, locking it behind steel doors and doctrine where no outsider may learn it. The drowned Paladin's Codex was never meant to leave the bunker: it lists what they keep, and where, and how it is guarded. Page by page the oracles unpick its cipher, and what the cipher still hides, our sleeper in the archives of §Y[BOS.GetName]§! reads aloud in his dreams. The deep has always been patient with misers."
  mltd_bos_blood_in_the_water:0 "Blood in the Water"
  mltd_bos_blood_in_the_water_desc:0 "Steel and the bear have circled each other since long before the tribe learned its queen's name, and it takes very little to set them at each other's throats: an order that was never given, an [NCR.GetAdjective]-issue rifle beside a dead Initiate, a [BOS.GetAdjective] insignia pried from a burned Ranger outpost. Our sleeper provides the orders and the armoury provides the rest. §Y[MLT_MLULU.GetName]§! does not care which of them wins. Every war on the land sends its dead down the rivers to the sea, and the sea is hers."
  mltd_bos_paladin_gate_tt:0 "We hold a §YCivilian Infiltration§! token on §Y[BOS.GetName]§!, or our network covers more than §Y15%§! of it"
  mltd_bos_codex_gate_tt:0 "We hold a §YCivilian Infiltration§! token on §Y[BOS.GetName]§!, or our network covers more than §Y25%§! of it"
  mltd_bos_armoury_gate_tt:0 "We hold an §YArmy Infiltration§! token on §Y[BOS.GetName]§!, or our network covers more than §Y20%§! of it"
  mltd_bos_armoury_bare_tt:0 "Nothing worth taking is left in the armouries of §Y[BOS.GetName]§!. The tide brings back salvage instead, and the Coral Court sells it:"
  mltd_bos_war_feeds_tt:0 "§Y[BOS.GetName]§! and §Y[NCR.GetNameDef]§! are at war, and their dead go down to the sea:"
  mltd_bos_tension_rises_tt:0 "§Y$bos_tension_dynamic_modifier$§! rises by §Y10§! in §Y[BOS.GetName]§!, and in §Y[NCR.GetNameDef]§! if it still stands (never past §Y100§!). Past §Y60§!, the Elders begin to talk of taking back California."
  mltd_bos_accords_betrayed_tt:0 "The §Y$bos_nf_legion_defense_pact$§! bind §Y[BOS.GetName]§! to [NCR.GetNameDef], and every forged order reads as betrayal:"
  mltd_bos_no_quarrel_tt:0 "There is no quarrel left between §Y[BOS.GetName]§! and §Y[NCR.GetNameDef]§! for us to stir. The forged orders are sold to whoever will pay:"
  mltd_bos_red_tide:0 "A Red Tide"
  mltd_bos_red_tide_desc:0 "[BOS.GetName] and [NCR.GetNameDef] are killing each other in the California hills, and the rivers carry their dead down to the sea. The spawning pools have never been so fat, and the tribe's warriors have never been so eager to meet the living."
  ### Conflict sub-tree: Tlaloc and his heirs (mltd_tla_*)
  mltd_tla_the_iron_god_dreams:0 "The Iron God Dreams"
  mltd_tla_the_iron_god_dreams_desc:0 "Far to the south, in a lair of copper and cold light beneath old Mexico, a god that men built is forgetting itself one memory at a time. What it loses does not simply vanish. It bleeds out along the old §YChicoNet§! wavebands as static, and in the static there are dreams. The oracles of the Coral Court have listened to a sleeping god all their lives, and they know the sound of another one dreaming. They have begun to write down what the dying machine says in its sleep."
  mltd_tla_the_three_voices:0 "The Three Voices"
  mltd_tla_the_three_voices_desc:0 "The iron god speaks with three voices - an emperor's, a priest-king's and a rebel's - and they have argued over his throne for longer than the tribe has had a name. Where there is an argument there is a door. The Order's whisperers slip into the silences between the voices and speak to each in turn, softly, in the slow cadence of the tide, until none of them is quite certain which thoughts are its own. If the iron god is already dead, the voices wear crowns now, and kings are easier still to whisper to."
  mltd_tla_picking_the_iron_bones:0 "Picking the Iron Bones"
  mltd_tla_picking_the_iron_bones_desc:0 "A dying god keeps poor watch over its armouries. Its sentries are machines that forget their orders halfway through a patrol, its quartermasters men who long ago stopped expecting to be paid, and its children are too busy circling the corpse to count what leaves by the back door. The Order's quiet folk ride the coastal barges south and come home with crates: rifles still in their grease, field kit, little brass devices the tribe has no word for. What the tribe cannot use, the caravans will buy."
  mltd_tla_the_drowned_god_sleeps:0 "The Drowned God Sleeps"
  mltd_tla_the_drowned_god_sleeps_desc:0 "The drowned god sleeps while the iron god dies, and only one of them will ever wake. The oracles know the shape of the machine's dreams now, and they have learned to pour their own into it - the tide, the dark, the long cold patience of the deep - until there is less and less room left in the iron god for himself. Whatever he forgets, the Order catches and keeps. If he is already gone, his last dreams still drift through the wreck of the §YChicoNet§!, and the dead are even easier to rob than the dying."
  mltd_tla_chiconet_alive_tt:0 "§Y[TLA.GetNameDefCap]§!, one of [TLA_tlaloc.GetName]'s heirs or §Y[ARM.GetNameDef]§! still stands - or §Y[TLA_tlaloc.GetName]§! has already died, or we hold §Y[769.GetName]§!"
  mltd_tla_databanks_tt:0 "The oracles count what is left of §Y[TLA_tlaloc.GetName]§!'s memory: §Y[?TLA.current_databanks|0]§! of §Y[?TLA.max_databanks|0]§! databanks remain."
  mltd_tla_iron_god_dead_tt:0 "§Y[TLA_tlaloc.GetName]§! is gone. Whoever holds his bones now, his last dreams still drift through the static."
  mltd_tla_three_voices_network_tt:0 "§Y$mltd_agency_name$§! holds a §Ycivilian infiltration§! token, or more than §Y20%§! network coverage, against §Y[TLA.GetNameDef]§!, one of [TLA_tlaloc.GetName]'s heirs or §Y[ARM.GetNameDef]§! (waived once none of them remains)"
  mltd_tla_iron_bones_network_tt:0 "§Y$mltd_agency_name$§! holds an §Yarmy infiltration§! token, or more than §Y30%§! network coverage, against §Y[TLA.GetNameDef]§!, one of [TLA_tlaloc.GetName]'s heirs or §Y[ARM.GetNameDef]§! (waived once none of them remains)"
  mltd_tla_iron_bones_theft_tt:0 "Wherever the stockpiles run deep enough, the Order carries off §Y800§! infantry equipment from §Y[TLA.GetNameDef]§! (once [TLA_tlaloc.GetName] is gone, §Y300§! from each of his heirs instead) and §Y200§! support equipment from §Y[ARM.GetNameDef]§!."
  mltd_tla_drain_databanks_tt:0 "The oracles pour the deep's dreams into the failing machine: §Y[TLA_tlaloc.GetName]§! loses §R64§! of his §Y[?TLA.current_databanks|0]§! remaining databanks, and will fall silent weeks sooner."
  mltd_tla_heirs_haunted_tt:0 "The dead god's last dreams come to his children in their sleep:"
  mltd_tla_dreams_of_wire:0 "Dreams of Wire and Salt"
  mltd_tla_dreams_of_wire_desc:0 "The oracles wake with numbers in their mouths - formulas and schematics caught from the iron god's dreams and set down in shell-ink before they fade. Half of it is madness. The other half works."
  ### Round 13: Lovecraftian flavour events mltd.9-18 and their timed ideas (monthly pool on_monthly_MLT, shared 120-day cooldown; event text uses only the dark codes §o / §c, option text none)
  mltd.9.t:0 "The Investigator"
  mltd.9.d:0 "He came up the coast road in the rain, with a cardboard suitcase and a notebook swollen fat with damp, and took a room above the net-sheds at §o$VICTORY_POINTS_7064$§!. A private investigator, he says, out of some drowned city in the south whose name he never gives the same way twice. He buys the old fishermen their drinks and asks them about the ones who walked into the water and did not come back - not whether they drowned, but whether anyone has §cseen them since§!. The oracles say he sleeps with his shutters open so that he can hear the tide, and wakes in the small hours to write in his notebook in a script that is not English. He is not afraid of the water. He has asked, very politely, for an audience with §o[MLT_MLULU.GetName]§!."
  mltd.9.a:0 "Grant him his audience."
  mltd.9.b:0 "He has found what he came for. Let him stay."
  mltd.9.c:0 "Pay him to take the next caravan south."
  mltd.10.t:0 "The Aberrant Catch"
  mltd.10.d:0 "The fog came in at noon and has not lifted. One boat at a time the fishing fleet has crept home out of it, and the last to tie up at the boathouses brought in the catch the whole harbour is now crowding round. It is a fish, more or less. It has §ca second jaw where its gills should be§!, the second jaw has teeth, and it has not stopped working since the net came up. The fisherman who hauled it says the fog found his boat the moment he crossed the reef and followed him home as close as a dog, and that all the way in he could hear something under the hull counting his oar-strokes. He wants to know what should be done with it. So, it seems, does everyone else."
  mltd.10.a:0 "The deep gives, and we eat what it gives."
  mltd.10.b:0 "Row it back past the reef and let the fog have it."
  mltd.10.c:0 "Sell it to the mainland caravans as a curiosity."
  mltd.11.t:0 "The M'lyeh Look"
  mltd.11.d:0 "The caravan masters have taken to camping outside the shore villages rather than sleeping in them, and those who still come in keep their eyes on their boots. It is the children, they say. Since the §o$mltd_deep_ones$§! walked up out of the surf, the young of the shore villages - hatchling and human alike - have begun to change. The eyes grow wide and forget how to blink, the skin roughens to a grey sheen, and §cfolds open at the sides of the neck§! that close again when the child is lifted out of the water. The traders already have a name for it, and they say it under their breath. The tribe says it out loud, and proudly: mothers show off their marked children on the jetties at dusk, and the old women say that those who bear the mark of §o[MLT_MLULU.GetName]§!'s favour never die. They only go down to her."
  mltd.11.a:0 "Let them stare. The mark is a blessing."
  mltd.11.b:0 "Keep the marked ones away from the trade roads."
  mltd.12.t:0 "A Colour from the Sky"
  mltd.12.d:0 "Three nights ago a stone fell out of a clear sky into the eastern spawning pool, hissing like a blade in a quench-tub. The pool-keepers fished it out at dawn. It was the size of a man's head then; it is the size of a fist now, and it grows no cooler and gives off no heat. Since it fell, the water of that pool has shone at night with §ca colour no oracle can name§! - not green, not violet, but something the eye keeps sliding away from - and the eggs laid nearest to it hatch early, strangely, and all at once. The hatchlings are strong, and they do not sleep. The pool-keepers have stopped eating the fish from that water. They say it tastes of nothing now, and that they would like, if the Court permits, to sit beside the pool a while."
  mltd.12.a:0 "Wall the pool in stone. Nothing drinks from it."
  mltd.12.b:0 "Let the oracles drink, and see what the colour sees."
  mltd.13.t:0 "The Castaway's Monolith"
  mltd.13.d:0 "In the worst night of the storm-week the sea bed off the southern flats heaved itself up out of the water, black and steaming, and by morning it had sunk again. From the mud it left behind, the shore-watch dragged a sailor, starved to the bone and burned raw by the sun, raving in a mainland tongue. When he could be made to speak plainly he told the Coral Court that he had walked for two days across that risen mud to §ca white stone carved with shapes that were men and fish at once§!, and that in the night something had come up out of the water to it, vast and scaled, and clasped its arms about the stone as a worshipper clasps an idol. He will not eat. He will not sleep. He wants a boat, and to be carried in it as far from the sea as a boat can be carried."
  mltd.13.a:0 "Give him the boat, and let the coast forget him."
  mltd.13.b:0 "Keep him. Let him tell the oracles everything."
  mltd.14.t:0 "Pages from Point Lookout"
  mltd.14.d:0 "A trader out of the south-east, from the country along the Colorado, has come to the coral gates with a satchel of loose pages and a price he will not lower. They are copies, he says, made in a cramped pre-war hand from a book called the §oKrivbeknih§!, which a family named §oBlackhall§! kept for generations in a swamp house at §oPoint Lookout§!, on the far side of the continent - until one of them tried to copy it out before the Great War, fled west with the unfinished copy, and was never heard from again. Most of the pages are nonsense. Some are not. The Coral Court has laid them beside the §oBooks of M'lyeh§!, and certain of the diagrams §cmatch line for line§!, as though both were drawn from the same thing, by hands that had seen it."
  mltd.14.a:0 "Bind the pages into the Books. Whatever they are, they are ours."
  mltd.14.b:0 "Burn them. The Books of M'lyeh need no second voice."
  mltd.14.c:0 "Let him carry them north - for a toll."
  mltd.15.t:0 "The Lamp of Kingsport"
  mltd.15.d:0 "They came out of the fog on the longest night of the year: a file of silent pilgrims in hooded robes, who asked in an old and careful speech to be allowed to join the winter rite. Their leader carried a lamp that burned without smoke or flicker. They came, he said, from §oKingsport§!, a harbour on the far side of the continent whose lighthouse has never once gone dark, though none of our traders can find it on any map. They knelt with the tribe through the whole of the rite and sang words the tribe had never taught them. Then, an hour before dawn, they rose together and §cwalked down into the marsh cave§! beneath the old signal tower, and did not come out. The lamp can still be seen from the shore, shining steady and unwavering, far beneath the black water at the cave's mouth."
  mltd.15.a:0 "Seal the cave. The rite is ours alone."
  mltd.15.b:0 "Send a war-band down after the lamp."
  mltd.16.t:0 "The Painter of the Deep"
  mltd.16.d:0 "A painter who used to daub eyes on the prows of the fishing boats has taken to painting the walls of his hut instead, and half the tribe has filed through his doorway to look. The murals show the §o$mltd_deep_ones$§! at their feeding, and they are very good. Too good. Every scale is where it should be, and every tooth. The oracles have seen the $mltd_deep_ones$ close and swear that no one who had not stood §cnear enough to be eaten§! could paint them so. The painter says he works from memory, and from a stained pre-war print he lets no one see, signed with a name the damp has worn down to §oPickm§!. He sleeps by day. Every morning a trail of wet, webbed footprints runs up from the water's edge to his door, and none runs back."
  mltd.16.a:0 "Let the tribe look. They should know what walks among them."
  mltd.16.b:0 "Whitewash the walls and set a watch on his door."
  mltd.17.t:0 "Voices in the Static"
  mltd.17.d:0 "The oracles keep a pre-war radio in the House of Shells, dragged out of a wreck and coaxed back to life for the pleasure of hearing the mainland's music. For three weeks it has caught only one broadcast, on a band that ought to be empty. A voice speaks out of the static - calm, careful and faintly buzzing, like a man talking through a mouthful of bees - from somewhere beyond the eastern hills. It knows the name of every oracle of the Coral Court. It praises their learning. And it makes them an offer: that the wisest among them might be §ccarried far away, in perfect comfort§!, to places no living body could endure, and there be shown things the sea has never shown them. It asks only where to send the escort."
  mltd.17.a:0 "Smash the radio and drown the pieces."
  mltd.17.b:0 "Answer it. Ask what it knows."
  mltd.18.t:0 "The Hamlet That Would Not Hunt"
  mltd.18.d:0 "Three days' walk down the shingle, our scouts found a hamlet that is on none of the tribe's charts: a few dozen crooked huts huddled round a fire that is never allowed to go out. Its people are finned about the elbows and rheumy-eyed, and move as though the air were too thin for them. On the stones below the huts lies §ca carcass the size of a hill§!, pale and long dead, and they tend it like a shrine, washing it with seawater at every tide. They have no fear of the [GetMltdMirelurksName]. What they fear, and curse in their wet and bubbling tongue, is §chunters§! - any hunter, of anything - and they spat on our scouts' spears until the spears were laid down. Now they beg to be taken in under §o[MLT_MLULU.GetName]§!'s protection. Their dead god, they say, would have wished it."
  mltd.18.a:0 "Take them in. [MLT.GetNameDefCap] has room for all the sea's children."
  mltd.18.b:0 "Leave them to their dead god. Ours is only dreaming."
  ### Round 15: Hail M'lyeh (mltd.19, repeatable at most once a year; the target is saved in immediate as mltd_hail_target)
  mltd.19.t:0 "Hail M'lyeh"
  mltd.19.d:0 "The report came up the coast sewn into an oilskin, in the cramped hand of our agent inside §o[mltd_hail_target.GetNameDef]§!. For a year our agent had been cultivating one of the most trusted voices at §o[mltd_hail_target.GetLeader]§!'s side - a counsellor who sits in every war council and has read every secret the government keeps - and expected, sooner or later, to have to pay. Instead, behind a locked door, the counsellor drew the shutters, raised both arms with the fists clenched like claws, and spoke the two words our agents had waited years to hear: §cHail M'lyeh§!.\n\nThe counsellor has been one of the faithful for decades, it seems, waiting in the dry lands for someone from the sea to come and ask. Every door in that government will open for us now. And there are others: §ccut off one claw, and two more shall grow in its place§!."
  mltd.19.a:0 "Hail M'lyeh."
  mltd_hail_token_tt:0 "We gain a §YCivilian Infiltration§! token on §Y[mltd_hail_target.GetNameDef]§! and §G+10§! civilian intel there."
  ### Round 16: The General in the Shallows (mltd.20, from the critical success of mltd_op_indoctrinate_the_faithful)
  mltd.20.t:0 "The General in the Shallows"
  mltd.20.d:0 "Our oracles did not only preach to the sick and the hungry. They reached the war tents of §o[mltd_defector_country.GetNameDef]§! too, and one of its commanders, §o[mltd_defector.GetName]§!, listened longer than the rest. Three nights ago that camp woke to an empty tent and a line of bare footprints running down to the water. This morning §o[mltd_defector.GetName]§! knelt before the Coral Court, salt water to the waist, and swore to lead the children of the deep in the name of §c[MLT_MLULU.GetName]§!.\n\nThe soldiers left behind tell each other that their general was taken. The truth is worse, and they will learn it in battle: §cthe general went willingly§!."
  mltd.20.a:0 "Give the convert a command."
  mltd_flavour_strange_harvest:0 "The Strange Harvest"
  mltd_flavour_strange_harvest_desc:0 "The fog-catch was eaten - bones, second jaw and all - and the spawning pools have never been so full. Nobody mentions that this season's hatchlings are born with their eyes already open."
  mltd_flavour_unnamed_colour:0 "The Unnamed Colour"
  mltd_flavour_unnamed_colour_desc:0 "The oracles who drank from the star-stone's pool understand things they cannot explain and see things they will not describe. They work through the night without tiring, and laugh at nothing. The pool shines on."
  ### Conflict sub-tree: Heaven's Guard, Idaho (mltd_hea_*)
  mltd_hea_whispers_in_the_steam:0 "Whispers in the Steam"
  mltd_hea_whispers_in_the_steam_desc:0 "Far to the east, in the hills the old maps call Idaho, §Y[HEA.GetNameDef]§! pray to God and to the Great Steam that rises from the earth. But steam is only water that has forgotten what it is. Our oracles have begun to listen at the vents beneath their cathedrals, and in the hiss they hear the same voice that speaks to them out of the tide."
  mltd_hea_a_second_schism:0 "A Second Schism"
  mltd_hea_a_second_schism_desc:0 "[HEA.GetNameDefCap] were one church with [HGH.GetName] until the Schism tore them apart, and a church that has broken once breaks more easily the second time. Our converts in their choirs sing the old hymns half a tone flat, and teach that the Steam does not rise from Heaven at all, but from the drowned places beneath it."
  mltd_hea_steam_for_the_deep:0 "Steam for the Deep"
  mltd_hea_steam_for_the_deep_desc:0 "The engineers of [HEA.GetNameDef] tend the boilers and the steam-driven machines that make their faith so formidable. What their clergy will not share, their storehouses can be persuaded to lose - rifles, gauges, and the plans that go with them."
  mltd_hea_the_crusade_turns_south:0 "The Crusade Turns South"
  mltd_hea_the_crusade_turns_south_desc:0 "A zealot must always have an enemy, and it is the easiest thing in the world to turn his eyes away from the sea. Let [HEA.GetNameDef] march on the Latter-day heretics of Utah. The Order will follow in the wake of their columns and gather up whatever the crusade leaves behind."
  mltd_hea_schism_war_tt:0 "[HEA.GetNameDefCap] are already fighting their §Y$hea_war_in_heaven$§!: the new schism costs them more of their resolve."
  mltd_hea_crusade_tt:0 "§Y[HEA.GetNameDefCap]§! has begun its holy wars (§Y$hea_war_in_heaven$§!, §Y$hea_attack_utah$§!, or a war with §Y[WHT.GetNameDef]§!, §Y[EHT.GetNameDef]§! or §Y[NCN.GetNameDef]§!), or no longer exists, or the year is §Y2280§! or later"
  mltd_hea_crusade_loot_tt:0 "[HEA.GetNameDefCap] is at war in Utah: the Order gleans the crusade's battlefields."
  mltd_hea_pilgrims_of_the_steam:0 "Pilgrims of the Steam"
  mltd_hea_pilgrims_of_the_steam_desc:0 "Guardsmen who came to hear the voice in the vents have walked west to M'lyeh, and they preach in its streets that the Steam and the Tide are the same breath."
  ### Conflict sub-tree: the Utah road war - White Legs and Eighties (mltd_wht_*)
  mltd_wht_the_lake_god_answers:0 "The Lake God Answers"
  mltd_wht_the_lake_god_answers_desc:0 "§Y[WHT.GetNameDefCap]§! were driven from their sacred lake by [NCN.GetNameDef], and they still dream of returning to perform their rites on the spiral of stone that curls out into its salt. A lake is only a sea that has lost its way home. When our oracles pray to the [WHT.GetAdjective] God of the Lake, for the first time in generations, he answers."
  mltd_wht_the_drowned_shamans:0 "The Drowned Shamans"
  mltd_wht_the_drowned_shamans_desc:0 "The [WHT.GetAdjective] shamans read the future in salt and blood. Ours read it in water. A few of their shamans have begun to come to our fires, and what they carry home to [326.GetName] is no longer quite their own faith."
  mltd_wht_guns_for_both_sides:0 "Guns for Both Sides"
  mltd_wht_guns_for_both_sides_desc:0 "§Y[EHT.GetNameDefCap]§! and [WHT.GetNameDef] have raided each other across the Utah roads for as long as either can remember. The Order has salvaged guns to spare and no reason to love either of them. Sold to both at a good price, those guns will keep the road war burning long after we have spent the caps."
  mltd_wht_sand_in_the_engines:0 "Sand in the Engines"
  mltd_wht_sand_in_the_engines_desc:0 "[EHT.GetNameDefCap] worship the road and the machines that ride it. A handful of converts in their motor pools, a few spoonfuls of lake sand in the right tanks, and the great war-rides out of [478.GetName] begin to stall in the desert, while their armouries grow strangely light."
  mltd_wht_rites_on_the_spiral_jetty:0 "Rites on the Spiral Jetty"
  mltd_wht_rites_on_the_spiral_jetty_desc:0 "While [WHT.GetNameDef] and [EHT.GetNameDef] bleed each other on the salt flats, our priests walk out along the old spiral of black stone into the Great Salt Lake and wade in to the waist. Whatever [WHT.GetNameDef] called the god of that water, it has a new name now, and the name is ours."
  mltd_wht_shamans_converts_tt:0 "[WHT.GetNameDefCap] have taken up §Y$wht_god_lake$§! or §Y$wht_god_old$§!: their converts strengthen our own faith."
  mltd_wht_guns_war_tt:0 "[WHT.GetNameDefCap] and [EHT.GetNameDef] are at war: the Order's guns are paid for in blood as well as caps."
  mltd_wht_road_war_tt:0 "§Y[WHT.GetNameDefCap]§! and §Y[EHT.GetNameDef]§! are at war, or one has marched on the other (§Y$wht_betray_eighties$§! or §Y$EHT_steal_WHT_legs$§!), or one of them no longer exists, or the year is §Y2280§! or later"
  mltd_wht_jetty_old_ones_tt:0 "[WHT.GetNameDefCap] have taken up §Y$wht_god_lake$§! or §Y$wht_god_old$§!: their own shamans come to the rites."
  mltd_wht_rites_on_the_jetty:0 "Rites on the Jetty"
  mltd_wht_rites_on_the_jetty_desc:0 "Pilgrims come back from the salt lake with their eyes gone the colour of deep water, and the tribe fights as though the tide itself were standing behind it."
  ### Books of M'lyeh: expeditions (the focuses preview; events mltd.101-503 read the Book)
  mltd_first_book_expedition_tt:0 "Begins the expedition to recover §Y$mltd_first_book$§! from beneath the altar-stone at §Y[150.GetName]§!."
  mltd_second_book_expedition_tt:0 "Begins the expedition down into the burrows of §Y[235.GetName]§! for §Y$mltd_second_book$§!."
  mltd_third_book_expedition_tt:0 "Begins the expedition to bring §Y$mltd_third_book$§! up out of §Y[231.GetName]§!."
  mltd_fourth_book_expedition_tt:0 "Begins the expedition to take §Y$mltd_fourth_book$§! from the elders of §Y[337.GetName]§!."
  mltd_fifth_book_expedition_tt:0 "§Y[MLT_MLULU.GetName]§! goes down into the drowned harbour at §Y[274.GetName]§! to read §Y$mltd_fifth_book$§!."
  mltd_when_book_found_tt:0 "\n§YWhen the book is found:§!"
  mltd_book_found_read_tt:0 "Another of the §YFive Books of M'lyeh§! is read."
  mltd_expedition_continues_tt:0 "The expedition presses on."
  mltd.101.t:0 "The Altar-Stone at [150.GetName]"
  mltd.101.d:0 "[DIS.GetNameDefCap] are gone from §o[150.GetName]§!, but their chapel still stands above the drowned fields, and beneath its altar-stone §o$mltd_first_book$§! has lain for a hundred years, wet in a dry place. The oracles have marked the stone. What remains is to decide how we come for it: openly, with drums and spears, so that the whole coast sees the tribe take back what is its own - or quietly, by night, so that no one sees anything at all."
  mltd.101.a:0 "March in with drums and spears."
  mltd.101.b:0 "Go by night. Let no one see."
  mltd.102.t:0 "The Last of [DIS.GetNameDef]"
  mltd.102.d:0 "The chapel was not empty. A handful of old §o[DIS.GetAdjective]§! still keep vigil over the altar, too stubborn or too frightened to leave it, and they have barred the door with their bodies. They say the Book is not ours to take. They say it has been §cwhispering to them for years§!, and that they alone ever learned how not to listen."
  mltd.102.a:0 "Put them to the spear."
  mltd.102.b:0 "Offer them the water instead."
  mltd.103.t:0 "$mltd_first_book$"
  mltd.103.d:0 "Beneath the altar-stone lies a slab of black coral, grown over with a script that wets itself to be read. It is heavier every time it is lifted, and lighter every time it is carried towards the sea. The oracles say §o$mltd_first_book$§! speaks of the ebb and of the flood, and of §cwhat the water carries back§! to those who feed it."
  mltd.103.a:0 "Carry it home to the sea."
  mltd.201.t:0 "Into [235.GetName]"
  mltd.201.d:0 "§o$mltd_second_book$§! was dragged down into the burrows beneath §o[235.GetName]§! long before the tribe came here, and the burrows go down further than anyone has ever mapped. The hunters want to go first and fast. The elders want to go slowly, sealing every side-tunnel behind them, so that whatever gnawed the Book cannot follow them home."
  mltd.201.a:0 "The hunters go first."
  mltd.201.b:0 "Seal every burrow behind us."
  mltd.202.t:0 "The Tunnel Gives Way"
  mltd.202.d:0 "Deep in the burrows the old tunnel gives way, and the expedition is cut in two by a fall of earth and carapace. Something in the dark beyond the rubble is already moving towards the trapped half. One of our war-chiefs must stay behind to hold the tunnel while the rest dig through - and whoever stays §cwill not come back§!."
  mltd.202.a:0 "[MLT_TERROR.GetName] holds the tunnel."
  mltd.202.b:0 "[MLT_TIDE_HUNTER.GetName] holds the tunnel."
  mltd.202.c:0 "No war-chief is left to spare. The warriors hold it."
  mltd.203.t:0 "$mltd_second_book$"
  mltd.203.d:0 "They bring it up in pieces: plates of carapace nested one inside the next, each scratched with the same script, and the innermost still warm. Laid out in order on the floor of the Coral Court, the plates close together into a single shell, sealed tight around nothing at all. The oracles say §o$mltd_second_book$§! teaches how a people may harden. They say §cit has already begun§!."
  mltd.203.a:0 "Lay the plates in the Coral Court."
  mltd.301.t:0 "The Whispering Pit"
  mltd.301.d:0 "[MDT.GetNameDefCap] threw §o$mltd_third_book$§! into §o[231.GetName]§!, and for years the pit has whispered to them every night. It whispers to our oracles now as well. The quickest way down is to lower the oracles on ropes and let them listen as they go. The safest way is to drain the pit first, which will take every pair of hands in the region and a great deal of time."
  mltd.301.a:0 "Lower the oracles on ropes."
  mltd.301.b:0 "Drain the pit, whatever it costs."
  mltd.302.t:0 "The Pit Speaks Back"
  mltd.302.d:0 "At the bottom of the pit the whispering stops, and something begins to speak §cin a voice that everyone recognises§!. It asks for one of our two great sages to come down and answer it. Whoever goes will bring the Book back up - but the oracles are certain that they will not come back as themselves, and may not come back at all."
  mltd.302.a:0 "[MLT_KNOWS.GetName] goes down."
  mltd.302.b:0 "[MLT_MUTANTS.GetName] goes down."
  mltd.302.c:0 "No sage remains. An oracle answers instead."
  mltd.303.t:0 "$mltd_third_book$"
  mltd.303.d:0 "What comes up out of the pit is not a book at all, but a length of dark rope knotted along its whole length in patterns that change when no one is watching them. Held in the hands, it pulls gently, like water, always towards the sea. The oracles say §o$mltd_third_book$§! teaches how §ca thousand minds may be turned as one§!."
  mltd.303.a:0 "Let it pull us on."
  mltd.401.t:0 "The Scripture of [337.GetName]"
  mltd.401.d:0 "The elders of §o[337.GetName]§! do not know that they own one of the Five Books. To them §o$mltd_fourth_book$§! is scripture, read aloud at every naming for two hundred years, and they will not give it up for the asking. The war-chiefs would simply take it. The traders say that every elder has a price, and that the tribe has caps."
  mltd.401.a:0 "Take it."
  mltd.401.b:0 "Buy it. Every elder has a price."
  mltd.402.t:0 "The Children of [337.GetName]"
  mltd.402.d:0 "Reading the Book aloud at last in its own tongue, our oracles understand what the elders never did: the spawning pools it describes are the ones in §o[337.GetName]§! itself, and the village's children have begun to take §cthe shapes it promises§!. Their parents are frightened. The children are not."
  mltd.402.a:0 "Bring the changed children to M'lyeh."
  mltd.402.b:0 "Leave them with their parents."
  mltd.403.t:0 "$mltd_fourth_book$"
  mltd.403.d:0 "The elders' scripture, read the right way, is a manual of spawning: when, and where, and how deep, and what to feed the pools so that what hatches from them is strong. The oracles have read it to the brood-mothers of §oM'lyeh§! every night since it arrived, and §cthe pools have never been so full§!."
  mltd.403.a:0 "Let the pools fill."
  mltd.501.t:0 "[MLT_MLULU.GetName] Goes Down"
  mltd.501.d:0 "The last of the Five Books has no pages. It is the thing at the bottom of the drowned harbour at §o[274.GetName]§!, and only §o[MLT_MLULU.GetName]§! herself can read it. She will go down. The only question the Coral Court can still decide is whether the tribe is told: whether they gather on the shore to watch their queen walk into the sea, or wake one morning to find that §cshe already has§!."
  mltd.501.a:0 "Let the whole tribe watch."
  mltd.501.b:0 "Tell no one until she returns."
  mltd.502.t:0 "What Waits in the Harbour"
  mltd.502.d:0 "Two of §o[MLT_MLULU.GetName]'s§! great champions went down into the harbour at her side. The thing at the bottom looked at all three of them, and §cit kept one§!. [MLT_MLULU.GetName] has come back to the surface. She will not say what she saw, but the tribe must know whose name to sing at the drowning-feast."
  mltd.502.a:0 "The [MLT_KILLCLAW.GetName] did not return."
  mltd.502.b:0 "The [MLT_KING.GetName] did not return."
  mltd.502.c:0 "She went down alone, and came back alone."
  mltd.503.t:0 "$mltd_fifth_book$"
  mltd.503.d:0 "§o[MLT_MLULU.GetName]§! has read §o$mltd_fifth_book$§!. She has not slept since. She speaks now in a voice that carries under water, and the tide at §oM'lyeh§! comes in a little further every night, as if §csomething beneath it were turning over in its sleep§!."
  mltd.503.a:0 "What is read cannot be unread."
  ### Old Castro, the Esoteric Order's spymaster (cultural advisor, +2 operative slots)
  MLT_OLD_CASTRO_NAME:0 "Old Castro"
  MLT_OLD_CASTRO_DESC:0 "Nobody in M'lyeh remembers [MLT_OLD_CASTRO.GetName] arriving. He was simply there one tide, a stooped sailor with salt in his beard, who knew the names of things the oracles had only dreamed of. He says little and forgets nothing. Every whisper carried along the coast finds its way to his ear, and every ear the Order owns, he bought."
  mltd_keeper_of_the_order:0 "Keeper of the Esoteric Order"
  mltd_keeper_of_the_order_desc:0 "Every ear the Order owns was bought by the Keeper, and every one of them still listens."
  ### Cult Infiltration (decision category mltd_cult_infiltration_cat; the cult lives on the target as mltd_cult_strength)
  mltd_cult_infiltration_cat:0 "Cult Infiltration"
  mltd_cult_infiltration_cat_desc:0 "The drowned faith does not stop at our borders. In the neighbouring majors, a sermon here and a disappearance there can grow into a cult that answers to §Y[MLT_MLULU.GetName]§!.\n\nA cult withers a little every week unless it is tended, and the larger it grows, the more it costs to keep. If we go to war with a country that harbours one, its faithful rise and sabotage the enemy from within.\n\n§YThe faithful abroad:§!\n[GetMltdCultList]"
  mltd_cult_list_rows:0 "[GetMltdCultRow1][GetMltdCultRow2][GetMltdCultRow3][GetMltdCultRow4][GetMltdCultRow5][GetMltdCultRow6][GetMltdCultRow7][GetMltdCultRow8][GetMltdCultMore]"
