  mltd_cult_found:0 "Found a Cult"
  mltd_cult_found_desc:0 "Our oracles have walked the roads of §Y[From.GetName]§! and found people who dream of water. A few gifts, a few secret meetings by the shore, and a cult of M'lyeh can take root there."
  mltd_cult_spread_the_word:0 "Spread the Word"
  mltd_cult_spread_the_word_desc:0 "Street preachers and pamphlets and tidewater tent-meetings."
  mltd_cult_whispers_in_the_halls:0 "Whispers in the Halls"
  mltd_cult_whispers_in_the_halls_desc:0 "Our agents inside the government of §Y[From.GetName]§! can open doors for the faithful: clerks, magistrates, the wives of ministers."
  mltd_cult_seed_the_barracks:0 "Seed the Barracks"
  mltd_cult_seed_the_barracks_desc:0 "Soldiers far from home are lonely, and our agents in the army of §Y[From.GetName]§! know which of them listen to the sea at night."
  mltd_cult_drown_the_doubters:0 "Drown the Doubters"
  mltd_cult_drown_the_doubters_desc:0 "Where our network reaches deep enough, the cult can stop hiding from the ones who speak against it. They are seen walking into the water, and nobody asks where they went."
