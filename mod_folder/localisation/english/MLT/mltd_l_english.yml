l_english:
  ### Focus tree (mltd_* focuses + tooltips)
  mltd_gifts_from_the_deep:0 "Gifts from the Deep"
  mltd_gifts_from_the_deep_desc:0 "The tide leaves offerings on the black sand: shells that hum, coral that bleeds, currents that whisper in the old tongue. §Y[MLT_MLULU.GetName]§! will teach her children to accept them - and to give something back. What the rituals take, the deep returns: after §Y$mltd_the_grand_ritual$§! the gifts also bring §G+20§! weekly manpower, and §Y$mltd_the_final_ritual$§! doubles it."
  mltd_call_of_the_deep_ones:0 "Call of the Deep Ones"
  mltd_call_of_the_deep_ones_desc:0 "Beneath §YM'lyeh§! something answers the drums. Not Mirelurk. Older. It has waited in the cold and the dark since before the bombs, since before men, for a queen to call it by name."
  mltd_the_grand_ritual:0 "The Grand Ritual"
  mltd_the_grand_ritual_desc:0 "\"That is not dead which can eternal lie, and with strange aeons even death may die.\"\nThe Coral Court has read the drowned tablets to the end. The price is written there too, in a tally of the living, and §Y[MLT_MLULU.GetName]§! has agreed to pay it. The rite takes a hundred days, and once the first name is read it cannot be stopped."
  mltd_the_deep_ones_walk:0 "The Deep Ones Walk"
  mltd_the_deep_ones_walk_desc:0 "They come up out of the surf at dusk in long grey ranks, and the coast-folk bar their doors and pray to gods that do not answer. The queen's new soldiers do not sleep, do not eat, and do not stop."
  mltd_the_final_ritual:0 "The Final Ritual"
  mltd_the_final_ritual_desc:0 "\"Ph'nglui mglw'nafh M'lulu M'lyeh wgah'nagl fhtagn.\"\nThe stars are coming right. When the last word is sung the §Y$mltd_star_spawn$§! will walk in her wake, and far beneath §YM'lyeh§! the drowned city will stir in its sleep - to rise, with its priestess upon its highest tower, on the day every shore belongs to the tide. Long months of chanting stand between the tribe and that first stirring, and once the first word is sung there is no turning back."
  mltd_gifts_unlocked_tt:0 "Opens the §Y$mltd_gifts_from_the_deep$§! decisions - each Book of M'lyeh unlocks one gift. §YOne§! gift may be active at a time."
  mltd_adds_dynamic_modifier_tt:0 "Adds §Y$MODIFIER$§! (its gifts are granted by decisions)"
  mltd_deep_ones_decision_unlocked_tt:0 "Unlocks the §Y$mltd_summon_the_deep_ones$§! decision."
  mltd_gifts_max_2_tt:0 "§YTwo§! $mltd_gifts_from_the_deep$ may now be active at once."
  mltd_deep_ones_template_unlocked_tt:0 "The §Y$mltd_deep_ones$§! division template is unlocked: it may now be edited and trained like any other."
  mltd_star_spawn_decision_unlocked_tt:0 "Unlocks the §Y$mltd_summon_the_star_spawn$§! decision."
  mltd_star_spawn_template_unlocked_tt:0 "The §Y$mltd_star_spawn$§! division template is unlocked: it may now be edited and trained like any other."

  ### Events mltd.1-8 (2/4/6 = world news, one option each, delivered via every_other_country so MLT never sees them; event text uses only the dark codes §o / §c)
  mltd.1.t:0 "$mlt_kingdom_of_mlyeh$"
  mltd.1.d:0 "The last of the coral gates has been raised from the silt, and the Coral Court has spoken aloud the name that was never to be spoken above the water. §o[MLT.GetNameDefCap]§! is no longer a promise whispered to hatchlings in the dark of the spawning pools. It is a kingdom. From [358.GetName] to the drowned piers of the old coast, every shell-clad tribesman has knelt in the brackish shallows and felt the cold weight of her attention settle upon him. §o[MLT_MLULU.GetName]§! does not rise - not yet - but her dreaming has changed its shape, and the tide now comes in when she wills it. The oracles say the Old Ones stir in their graves beneath the earth and beneath the sea. Let them stir. The Queen has her crown."
  mltd.1.a:0 "In her house at M'lyeh, M'lulu waits dreaming."
  mltd.1.b:0 "A thousand years she will reign!"
  mltd.2.t:0 "A Kingdom Beneath the Waves"
  mltd.2.d:0 "Word travels slowly along the Pacific coast, carried by salt-crusted traders and the few caravans that still dare the Oregon marshes. The tale is always the same, and always a little different in the telling. The crab-worshippers of [358.GetName] have crowned their god. Their oracles speak of a city beneath the waves, of a drowned queen called §o[MLT_MLULU.GetName]§!, of a kingdom whose borders are drawn not on land but along the tide-line itself. Most dismiss it as tribal madness of the usual sort. Yet the fishermen of the northern coasts say the water has grown strangely cold this season, and that on moonless nights something very large moves against the current, far out past the breakers, where nothing large should be."
  mltd.2.a:0 "Tribal superstition. Nothing more."
  mltd.3.t:0 "$mltd_the_grand_ritual$"
  mltd.3.d:0 "For seven nights the drums have not stopped. For seven nights the spawning pools have run black with offerings, and the Coral Court has chanted words that no human throat was shaped to make. On the eighth dawn the water went still - utterly, unnaturally still - and every tribesman on the coast heard the same voice speak in the hollow behind their eyes. §o[MLT_MLULU.GetName]§! is pleased. §o[MLT_MLULU.GetName]§! is hungry. $mltd_the_grand_ritual$ is complete. For a hundred dawns a few walked out into the brackish water and did not come back; the oracles kept the tally and called it the toll. This morning no one was called. The tally is closed, the deep is sated, and the priestess-queen may now hold two of its gifts at once."
  mltd.3.a:0 "The deep has been fed."
  mltd.4.t:0 "The Seas Grow Darker"
  mltd.4.d:0 "Something has gone wrong with the sea. The tides no longer keep to the old tables; they come in twice in a night, or not at all, and leave the beaches strewn with pale things that rot before anyone can name them. Fishing boats put out from the northern harbours and do not return, or return empty, their crews silent and unwilling to say what they saw beneath the hulls. From the drowned coasts of Oregon to the Baja shore, sleepers wake sweating from the same dream: a city of black stone rising out of green water, its angles all wrong, and a voice beneath it calling a name. A cold wind blows out of the west, and it smells of salt and of very old things."
  mltd.4.a:0 "Bar the harbours. Pray it passes."
  mltd.5.t:0 "$mltd_the_final_ritual$"
  mltd.5.d:0 "There is no moon tonight, and there will be no dawn worth the name. $mltd_the_final_ritual$ has been sung to its end, and the last of the words has gone down into the water like a stone. Now the water gives back. Out of the drowned streets of §oM'lyeh§! they come - not the $mltd_deep_ones$, who were merely her children, but the ones who came with the Old Ones out of the sky before there were any men. The $mltd_star_spawn$ walk. Their shapes will not hold still for the eye; their footprints fill with brine that does not drain. The Coral Court has gone silent, its oracles blind and smiling. §o[MLT_MLULU.GetName]§! needs no oracles now. She has never been so near, and the whole coast can feel it."
  mltd.5.a:0 "The $mltd_star_spawn$ walk."
  mltd.5.b:0 "Ph'nglui mglw'nafh M'lulu M'lyeh wgah'nagl fhtagn."
  mltd.6.t:0 "The Stars Are Right"
  mltd.6.d:0 "The stars are right. Every astronomer who still owns a working lens has seen it, and every one of them has tried to explain it away. The constellations over the Pacific have shifted into shapes that no chart records, and they do not shift back. On the coasts of Oregon the tide comes in black, and goes out a little slower every night. In the marshes the crab-worshippers dance, and things dance with them that are not crabs and were never men. Everyone who sleeps now walks the streets of the sunken city and hears a voice beneath it, though no one can yet say what it is saying. The dancers say that §o[MLT_MLULU.GetName]§! is only the first to wake, and that the city itself will not rise until the land is ready for it."
  mltd.6.a:0 "Then may the gods, if there are any left, have mercy on us all."

  ### Sub-units and reward technologies
  mltd_deep_ones:0 "Deep Ones"
  mltd_deep_ones_short:0 "$mltd_deep_ones$"
  mltd_deep_ones_desc:0 "They went down into the black water at §Y[MLT_MLULU.GetName]§!'s call and came back changed - wide-mouthed, unblinking, cold to the touch. They do not drown, they do not tire, and they do not return to the land as what they were."
  mltd_star_spawn:0 "Star Spawn"
  mltd_star_spawn_short:0 "$mltd_star_spawn$"
  mltd_star_spawn_desc:0 "Not hatched from any egg. They came to the young world out of the sky and slept beneath §YM'lyeh§! until the stars were right. Vast, and wrong, and hers."
  mltd_star_spawn_tech:0 "The $mltd_star_spawn$"
  mltd_star_spawn_tech_desc:0 "The stars are right. What came down out of the sky when the world was young rises again beneath §Y[MLT_MLULU.GetName]§!'s sway.\n\nAnd with strange aeons even death may die."

  ### Decisions, missions, dynamic modifier, ideas, scripted-effect tooltips
  mltd_gifts_from_the_deep_cat:0 "§Y$mltd_gifts_from_the_deep$§!"
  mltd_gifts_from_the_deep_cat_desc:0 "In the drowned halls of §YM'lyeh§! the priestess-queen §Y[MLT_MLULU.GetName]§! bargains with that which sleeps below. Offer it the living and the deep will lend the tribe its strength - for a time. Each gift costs §Y500§! of the faithful and lasts thirty days.\n\nGifts held: §Y[?mltd_gifts_active]§! / §Y[?mltd_gifts_max]§!"
  mltd_children_of_the_deep_cat:0 "§Y$mltd_children_of_the_deep$§!"
  mltd_children_of_the_deep_cat_desc:0 "The waters off the coast churn with shapes that were old when the first men crawled from the sea. §Y[MLT_MLULU.GetName]§! has called, and her children are answering. Everything here is paid for in flesh. What we summon, every land we hold pays for together, each in proportion to what it has, and the thing itself wades ashore at the capital; what we merely give away is taken from one land alone, and the sea repays it in salvage and in fresh water."
  mltd_gift_of_the_tide:0 "Gift of the Tide"
  mltd_gift_of_the_tide_desc:0 "Five hundred of the faithful walk singing into the surf at the priestess-queen's word, and do not walk out. The tide that takes them comes back twice as strong, and for a season our warriors strike with the whole weight of the ocean behind them."
  mltd_gift_of_the_tide_mission:0 "The Tide Runs High"
  mltd_gift_of_the_tide_mission_desc:0 "The §Y$mltd_gift_of_the_tide$§! is upon us. When the count runs out the water recedes, and takes back the strength it lent."
  mltd_gift_of_the_shell:0 "Gift of the Shell"
  mltd_gift_of_the_shell_desc:0 "The offered are given to the shallows, and the deep gives back a hardness of carapace. Blades glance and bullets skip; for a season our warriors are as the black rocks the sea breaks itself upon."
  mltd_gift_of_the_shell_mission:0 "The Shell Holds"
  mltd_gift_of_the_shell_mission_desc:0 "The §Y$mltd_gift_of_the_shell$§! hardens our warriors. When the count runs out the carapace softens to what it was."
  mltd_gift_of_the_current:0 "Gift of the Current"
  mltd_gift_of_the_current_desc:0 "Five hundred go beneath, and from beneath comes a whisper that every one of the tribe hears at once. Our warriors move as a single body turned by one unseen current, and they do not break."
  mltd_gift_of_the_current_mission:0 "One Current, One Mind"
  mltd_gift_of_the_current_mission_desc:0 "The §Y$mltd_gift_of_the_current$§! binds our warriors into one will. When the count runs out the whisper fades, and each is alone in its shell again."
  mltd_gift_of_the_brood:0 "Gift of the Brood"
  mltd_gift_of_the_brood_desc:0 "The offered feed the spawning pools, and the pools teem. Clutch after clutch hatches under the black water; §Y[MLT_MLULU.GetName]§!'s brood swells, and every hatchling is a soldier born."
  mltd_gift_of_the_brood_mission:0 "The Pools Teem"
  mltd_gift_of_the_brood_mission_desc:0 "The §Y$mltd_gift_of_the_brood$§! swells our numbers. When the count runs out the pools fall quiet."
  mltd_gift_of_the_abyss:0 "Gift of the Abyss"
  mltd_gift_of_the_abyss_desc:0 "Five hundred descend and do not return, and those who remain sleep soundly for the first time in years. The dreams that trouble the tribe are not gone. They have merely been given someone else to visit."
  mltd_gift_of_the_abyss_mission:0 "The Abyss Is Quiet"
  mltd_gift_of_the_abyss_mission_desc:0 "The §Y$mltd_gift_of_the_abyss$§! stills the dreaming of the tribe. When the count runs out, the dreams come back."
  mltd_summon_the_deep_ones:0 "Summon the Deep Ones"
  mltd_summon_the_deep_ones_desc:0 "Eight thousand of the faithful are led chanting into the black water, and every one of our lands gives up its share of them. What comes back up is not them. Great gilled cold-blooded things wade ashore where the offering was made, beneath the priestess-queen's banner - the §Y$mltd_deep_ones$§!, and they are hungry."
  mltd_summon_the_star_spawn:0 "Summon the Star Spawn"
  mltd_summon_the_star_spawn_desc:0 "Sixteen thousand souls are poured into the black water, drawn from every one of our lands at once, and the black water answers with something that came from the sky before there was a sky. The §Y$mltd_star_spawn$§! rise where the offering was made, vast and many-limbed, and even the $mltd_deep_ones$ give way before them."
  mltd_gift_slots_tt:0 "Fewer than §Y[?mltd_gifts_max]§! gifts are held at once (currently §Y[?mltd_gifts_active]§!)"
  mltd_gift_lasts_30_days_tt:0 "The gift lasts §Y30§! days, then the deep takes it back"
  mltd_gift_tide_on_tt:0 "Modifies §HArmy Attack§! for §Y$mltd_gifts_from_the_deep$§! by [?mltd_gift_value_temp|+%]"
  mltd_gift_tide_off_tt:0 "The §Y$mltd_gift_of_the_tide$§! recedes: §HArmy Attack§! bonus of [?mltd_gift_tide_var|+%] is lost"
  mltd_gift_shell_on_tt:0 "Modifies §HArmy Defense§! for §Y$mltd_gifts_from_the_deep$§! by [?mltd_gift_value_temp|+%]"
  mltd_gift_shell_off_tt:0 "The §Y$mltd_gift_of_the_shell$§! softens: §HArmy Defense§! bonus of [?mltd_gift_shell_var|+%] is lost"
  mltd_gift_current_on_tt:0 "Modifies §HDivision Organization§! for §Y$mltd_gifts_from_the_deep$§! by [?mltd_gift_value_temp|+%]"
  mltd_gift_current_off_tt:0 "The §Y$mltd_gift_of_the_current$§! fades: §HDivision Organization§! bonus of [?mltd_gift_current_var|+%] is lost"
  mltd_gift_brood_on_tt:0 "Modifies §HRecruitable Population§! for §Y$mltd_gifts_from_the_deep$§! by [?mltd_gift_value_temp|+%]"
  mltd_gift_brood_off_tt:0 "The §Y$mltd_gift_of_the_brood$§! falls quiet: §HRecruitable Population§! bonus of [?mltd_gift_brood_var|+%] is lost"
  mltd_gift_abyss_on_tt:0 "Modifies §HStability§! for §Y$mltd_gifts_from_the_deep$§! by [?mltd_gift_value_temp|+%]"
  mltd_gift_abyss_off_tt:0 "The §Y$mltd_gift_of_the_abyss$§! stirs: §HStability§! bonus of [?mltd_gift_abyss_var|+%] is lost"
  mltd_all_gifts_permanent_tt:0 "The stars are right. Every one of the §Y$mltd_gifts_from_the_deep$§! becomes §Ypermanent§!: §HArmy Attack§! §G+20%§!, §HArmy Defense§! §G+20%§!, §HDivision Organization§! §G+20%§!, §HRecruitable Population§! §G+30%§!, §HStability§! §G+20%§!. No gift need be asked for again: the gift decisions and their category close."
  mltd_spawn_deep_ones_tt:0 "A division of §Y$mltd_deep_ones$§! (8 battalions, 20 combat width) rises from the water, fully armed, with §Y32§! spare (a fifth of its need)"
  mltd_spawn_star_spawn_tt:0 "A division of §Y$mltd_star_spawn$§! (8 battalions, 20 combat width) rises from the water, fully armed, with §Y16§! spare (a fifth of its need)"
  mltd_summon_sf_room_tt:0 "§Y$mltd_summoned_host$§!: $MODIFIER_SPECIAL_FORCES_MIN$ §G+8§! battalions for good - the division's own room under the cap, so it takes none a trained one could use"
  mltd_summoned_host:0 "The Summoned Host"
  mltd_summoned_host_desc:0 "Each division the sea gives up comes with its own place in the ranks: the cap on our special forces grows by as many battalions as the sea has sent."
  mltd_grand_ritual_toll_modifier_tt:0 "Every day §R0.1%§! of the people of every owned state (never fewer than §R1§!; states of 500 or fewer are spared) is given to the deep"
  mltd_final_ritual_toll_modifier_tt:0 "Every day §R0.25%§! of the people of every owned state (never fewer than §R1§!; states of 500 or fewer are spared) is given to the deep"

  ### Intelligence operation
  mltd_op_indoctrinate_the_faithful:0 "Indoctrinate the Faithful"
  mltd_op_indoctrinate_the_faithful_desc:0 "The Coral Court sends its oracles into [From.GetNameDef], to whisper at the water's edge of the Great Old Ones and of the priestess-queen who waits beneath the tide. The sick will listen, and the hungry, and those who already dream of a drowned city without knowing its name. Those who hear the call of §Y[MLT_MLULU.GetName]§! will walk into the swamp, and they will not look back."
  mltd_op_indoctrinate_the_faithful_tt:0 "The more manpower [From.GetNameDef] has, the more of it answers the call: §Y5,000§! above §Y50,000§!, §Y2,500§! above §Y25,000§!, §Y1,000§! above §Y10,000§!, §Y250§! above §Y5,000§! and §Y100§! above §Y1,000§!. It is counted again when the operation ends, and never comes to more than the figure above.\nOn a §Gcritical success§! the call reaches the war tents too: one of the generals of [From.GetNameDef] - never a field marshal, a leader or an advisor - crosses over to us, if it has one to spare."

  ### Round 2: equipment, Children of the Deep, ritual gates
  mltd_deep_ones_equipment:0 "$mltd_deep_ones$"
  mltd_deep_ones_equipment_desc:0 "The drowned faithful of §YM'lyeh§!, risen from the black water with scale, claw and a hunger older than the bombs. They are not issued; they are called."
  mltd_deep_ones_equipment_1:0 "$mltd_deep_ones$"
  mltd_deep_ones_equipment_1_short:0 "$mltd_deep_ones$"
  mltd_deep_ones_equipment_1_desc:0 "Amphibious horrors that answered the call of the §YCoral Court§!. Each one is a child of the tide given back to the shore, hardened by the pressure of the deep and armed with nothing but itself."
  mltd_star_spawn_equipment:0 "$mltd_star_spawn$"
  mltd_star_spawn_equipment_desc:0 "The dreaming things that came down when the stars were right. §Y[MLT_MLULU.GetName]§! does not command them so much as point, and the sea follows."
  mltd_star_spawn_equipment_1:0 "$mltd_star_spawn$"
  mltd_star_spawn_equipment_1_short:0 "$mltd_star_spawn$"
  mltd_star_spawn_equipment_1_desc:0 "Vast, slow and impossible to kill, the §Y$mltd_star_spawn$§! wade ashore where the rituals have thinned the world. Their hide turns bullets, their reach breaks walls, and the ground they cross remembers them."
  mltd_children_of_the_deep:0 "Children of the Deep"
  mltd_children_of_the_deep_desc:0 "The §Y$mltd_deep_ones$§! have walked out of the water and into the ranks, and nothing in the tribe's old law says how many of them there may be. §Y[MLT_MLULU.GetName]§! has settled the matter: as many as the sea will give. The priestess-queen's host is no longer measured in [GetMltdMirelurksName] and militia but in the gilled, the many-limbed and the things that will not stay dead."
  mltd_grand_ritual_population_tt:0 "Requires a national population of at least §Y100,000§! (currently §Y[?mltd_national_population|0]§!)"
  mltd_final_ritual_population_tt:0 "Requires a national population of at least §Y200,000§! (currently §Y[?mltd_national_population|0]§!)"

  ### Round 3: hidden equipment techs, pentagram placeholder, ritual tooltip lines
  mltd_deep_ones_equipment_tech:0 "Spawn of the Deep"
  mltd_deep_ones_equipment_tech_desc:0 "The first of §YM'lyeh§!'s children has walked up out of the black water, and the tribe has learned how to call more of them to its side. Hidden knowledge: this is never researched, only revealed."
  mltd_star_spawn_equipment_tech:0 "Spawn of the Stars"
  mltd_star_spawn_equipment_tech_desc:0 "The first of the things that fell when the stars were right has risen at §Y[MLT_MLULU.GetName]§!'s word, and the tribe has learned how to call more of them to its side. Hidden knowledge: this is never researched, only revealed."
  mltd_ritual_duration_tt:0 "§YFor the duration of the ritual:§!"
  mltd_newline_tt:0 " \n"
