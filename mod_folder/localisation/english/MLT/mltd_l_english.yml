  mltd_cult_list_more:0 "  §g...and [?ROOT.mltd_cult_more|0] more§!"
  ### Round 17: cults are founded and nurtured by operations; the faithful answer two untargeted calls
  mltd_cult_call_for_people:0 "Call for People"
  mltd_cult_call_for_people_desc:0 "Word goes out to every congregation of the drowned faith at once. The young, the desperate and the devout slip away from their towns by night and walk to the sea, where §Y$mltd_the_wet_market$§! boats are waiting to bring them home to us."
  mltd_cult_call_for_equipment:0 "Call for Equipment"
  mltd_cult_call_for_equipment_desc:0 "The faithful in the depots, the armouries and the quartermasters' offices of every land that shelters a cult begin to lose crates. Rifles, tools and ammunition drift down the rivers to the coast.\n\nOnce the tribe marches on its beasts rather than its rifles - from §Y$mltd_mars_in_the_water$§! on - the faithful send what it fights with instead: the mirelurks of their own rivers and lakes, one for every point of the cults' strength, herded down to the sea."
  mltd_cult_any_tt:0 "At least one cult of §YM'lyeh§! endures abroad (total strength §Y[?mltd_cult_total_strength|0]§!)"
  mltd_cult_call_people_cooldown_tt:0 "The faithful have given all they can spare. Days until they answer a call for people again: §Y[?mltd_cult_call_people_cooldown:days_left|0]§!"
  mltd_cult_call_equipment_cooldown_tt:0 "The smuggling routes have gone cold. Days until the faithful answer a call for arms again: §Y[?mltd_cult_call_equipment_cooldown:days_left|0]§!"
  mltd_cult_call_people_tt:0 "Every cult abroad sends its faithful: §G+[?mltd_cult_call_amount|0]§! manpower (§Y10§! for each point of cult strength across every country, now §Y[?mltd_cult_total_strength|0]§!)"
  mltd_cult_call_equipment_tt:0 "Every cult abroad smuggles out arms: §G+[?mltd_cult_call_infantry|0]§! infantry equipment and §G+[?mltd_cult_call_support|0]§! support equipment (§Y4§! and §Y1§! for each point of cult strength across every country, now §Y[?mltd_cult_total_strength|0]§!)"
  mltd_cult_call_people_again_tt:0 "The faithful can be called on for people again in §Y90§! days"
  mltd_cult_call_equipment_again_tt:0 "The faithful can be called on for arms again in §Y90§! days"
  mltd_op_found_a_cult:0 "Found a Cult"
  mltd_op_found_a_cult_desc:0 "Our operatives walk the roads of a foreign land and find the people who dream of water. A few gifts, a few meetings by the shore at night, and a congregation of M'lyeh takes root."
  mltd_op_found_a_cult_tt:0 "A cult of §YM'lyeh§! takes root in the target at §G10%§! (§G20%§! on a critical success). It withers every week unless it is nurtured."
  mltd_op_nurture_the_cult:0 "Nurture the Cult"
  mltd_op_nurture_the_cult_desc:0 "Arms for the faithful to hide, food for their families and a preacher who knows the old words: our operatives keep a congregation alive and help it grow."
  mltd_op_nurture_the_cult_tt:0 "The cult in the target grows by §G12%§! (§G20%§! on a critical success)."
  mltd_ncr_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[NCR.GetName]§! and §Y[MOT.GetName]§! wither §Ghalf as fast§!."
  mltd_tex_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[TBH.GetName]§! and §Y[LNS.GetName]§! wither §Ghalf as fast§!."
  mltd_wbh_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in the Brotherhood that holds Washington - §Y[WBH.GetNameDef]§!, or §Y[TCA.GetNameDef]§! once it has taken their place - wither §Ghalf as fast§!."
  mltd_ces_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[CES.GetName]§! wither §Ghalf as fast§!."
  mltd_bos_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[BOS.GetName]§! wither §Ghalf as fast§!."
  mltd_tla_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[TLA.GetName]§!, §Y[MAX.GetName]§!, §Y[MOC.GetName]§!, §Y[ZAP.GetName]§! and §Y[ARM.GetName]§! wither §Ghalf as fast§!."
  mltd_hea_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[HEA.GetName]§! wither §Ghalf as fast§!."
  mltd_wht_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[WHT.GetName]§! and §Y[EHT.GetName]§! wither §Ghalf as fast§!."
  mltd_cult_not_full_tt:0 "The cult does not yet hold the whole country (below §Y100%§!)"
  mltd_cult_infiltration:0 "The Drowned Faithful"
  mltd_cult_infiltration_desc:0 "A cult of M'lyeh has spread through this country. While it is at war with [MLT.GetNameWithFlag], the faithful rise: they spread panic, desert their posts, wreck the factories and see that the planes do not come back."
  ### Round 14: The Spreading Cult (opens Cult Infiltration and founds the agency; mltd_intel_foothold no longer does)
  mltd_the_spreading_cult:0 "The Spreading Cult"
  mltd_the_spreading_cult_desc:0 "[MLT.GetNameDefCap] is proclaimed, and the tide does not stop at the shore. Our preachers walk inland along the rivers, and in the cities of the neighbouring majors people have begun to dream of water."
  mltd_spreading_cult_unlocks_tt:0 "Unlocks the §Y$mltd_cult_infiltration_cat$§! decisions and, with §YLa Resistance§!, the operations §Y$mltd_op_found_a_cult$§! and §Y$mltd_op_nurture_the_cult$§!, which reach any country our network covers."
  mltd_spreading_cult_founds_tt:0 "A cult of §YM'lyeh§! takes root at §G20%§! in every neighbouring §Ymajor§!."
  # round 28c review: an agency can still be founded from the intelligence screen while the focus runs, so both outcomes (the 50 is the focus's literal)
  mltd_spreading_cult_agency_tt:0 "Founds the tribe's intelligence agency, §Y$mltd_agency_name$§! - or, if we have founded one ourselves by the time the focus completes, Political Power: §G+50§! instead."
  ### Round 14: The Wet Market (focus and idea share the key) and the Books' network gate
  mltd_the_wet_market:0 "The Wet Market"
  mltd_the_wet_market_desc:0 "Below the coral gates of M'lyeh, where the tide goes out twice a day, there is a market that is on no map. Salvage from drowned wrecks, relics dredged from the deep and guns with the serial numbers filed off change hands in the dark, and every trader in the wastes knows the way down."
  mltd_the_wet_market_orgs_tt:0 "Opinion with every §Y$TRADE_LEDGER_TITLE$§! seller (§Y[GetGunRunnerName]§!, §Y[GetMotorizedRunnerName]§!, §Y[GetEnergyRunnerName]§!, §Y[GetMeleeRunnerName]§! and §Y[GetAdvancedRunnerName]§!): §G+40§!"
  ### Round 16: The Wet Market as a seller in the Organization Marketplace (scripted GUIs mltd_wet_market_tab / _panel)
