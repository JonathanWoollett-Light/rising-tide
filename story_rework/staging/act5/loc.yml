  # ---- Round 27, Act V "The Sea Against Mars" (mltd_act5_focus.txt): the chapter, the close, their events, news and idea
  mltd_mars_in_the_water:0 "Mars in the Water"
  mltd_mars_in_the_water_desc:0 "The bear lies drowned in its own wells, and the tide stands on the western bank of the Colorado. On the far bank the scouts of §Y[CES.GetNameDef]§! lead their pack-brahmin down to drink, and the brahmin will not: the river is running salt, a hundred leagues from any sea. In §Y[520.GetName]§! the augurs open bird after bird and will not say what they find. For a generation [CES.GetNameDef] has taught the wasteland that its god is war. Now the wasteland will learn what war looks like to a god who lives beneath the water, and the Coral Court sends its oracles, its drowned and its drums up every river that runs into the Legion's land."
  mltd_when_the_legion_breaks:0 "When the Legion Breaks"
  mltd_when_the_legion_breaks_desc:0 "The Legion was built to break other peoples - tribes, towns, whole nations fed to the cross and the collar until nothing was left but the Legion. It was never built to be broken itself, and it does not know how. When its legates lie in the river mud and its crosses come down, the pens of §Y[520.GetName]§! will still be full: thousands of the chained, with no masters left to sell them. The Coral Court has already decided that they belong to the sea. It has not yet decided how - walked into the surf with their collars struck off, to rise as the faithful of §YM'lyeh§!, or given whole to the spawning pools, which are always hungry. And on the altar of Mars, where the Legion burned its offerings, the oracles have set a basin of salt water, and something has begun to kneel before it."
  mltd_legion_beaten_tt:0 "§Y[CES.GetNameDefCap]§! has capitulated, is no more, or is our subject"
  mltd_legion_breaks_choice_tt:0 "§YThe Coral Court decides the fate of the chained in the pens of [520.GetName]:§!"
  mltd_legion_breaks_freed_tt:0 "§YThe chained are freed into the tide:§!"
  mltd_legion_breaks_pens_tt:0 "§YOr the pens feed the spawning pools:§!"
  mltd.50.t:0 "The River Runs Salt"
  mltd.50.d:0 "The report came downriver on a raft of reeds, in the hand of an oracle who has worn a ferryman's rags on the Colorado for three years.\n\nThe scouts of §o[CES.GetNameDef]§! went down to the river at dawn to water their brahmin, and the beasts would not drink. A decanus waded in to his knees, cupped the water, tasted it and spat. It was §csalt§! - sea-salt, a hundred leagues from any sea - and since that morning it has run salt from the dam to the delta. The fish have not died. That frightens the legionaries more than anything else: the fish are thriving, there are more of them every day, and some of them are §cnot fish§!.\n\nIn §o[520.GetName]§! the augurs have opened bird after bird and will not say what they find. The frumentarii are hanging ferrymen along the river road. Our oracle writes that they have not yet hanged the right one, and that on the far bank, at night, the legionaries on watch have begun to pray to Mars in whispers, the way men pray to a god they are no longer sure can hear them."
  mltd.50.a:0 "Mars cannot swim."
  mltd.51.t:0 "The Pens of [520.GetName]"
  mltd.51.d:0 "The eagles are down. §o[CES.GetNameDefCap]§! is broken: its legates dead or kneeling in the river mud, its crosses pulled down along the roads, its war-god silent in his temple. What the Legion leaves behind is what the Legion always made most of - §cthe chained§!.\n\nThe slave pens of §o[520.GetName]§! and a hundred camps like them are full, and their masters are gone. Thousands stand behind the wire and watch the grey ranks of the $mltd_deep_ones$ walk in off the river, and they do not know yet whether they are being freed or only sold again.\n\nThe Coral Court has decided that they belong to the sea. It has not decided how. The collars can be struck off at the water's edge and the chained walked into the surf, to rise as the faithful of §oM'lyeh§! - there are elders in the Court who say the tide was always meant to free them. Or the pens can be emptied as they stand into the spawning pools, which have grown very large and are §calways hungry§!, and in a season what crawls out of them will march in the tribe's host."
  mltd.51.a:0 "Strike off the collars. Let them rise as the faithful."
  mltd.51.b:0 "The spawning pools are hungry. Empty the pens."
  mltd.52.t:0 "The Bull Goes Down to the Sea"
  mltd.52.d:0 "§o[CES.GetNameDefCap]§! has fallen. For as long as anyone east of the Colorado can remember, the Legion was the thing that came in the night with crosses and chains, and no town that saw its banner ever saw its own flag again. Now the golden bull has gone down - not to a rival Legion, not to a Republic, but to the tide.\n\nThe traders who come out of Arizona tell stories that nobody believes until the third or fourth telling. They say the river runs salt from the dam to the sea. They say the slave pens of §o[520.GetName]§! stand empty, their gates open and their wire hung with kelp, and that nobody can say where the chained have gone. They say that in the temple of Mars the altar has been §cfilled with sea water§!, and that the few legionaries left alive go down to the river at dusk, wade in to the waist, and stand there, listening.\n\nFirst the Republic, and now the Legion. Every capital still standing has done the same arithmetic, and none of them likes the answer."
  mltd.52.a:0 "Even Mars could not hold back the sea."
  mltd_mars_beneath_the_waves:0 "Mars Beneath the Waves"
  mltd_mars_beneath_the_waves_desc:0 "The war-god of [CES.GetNameDef] was dragged down into the green dark, and he has learned to swim. Legionaries who knelt to the tide march in the host of §Y[MLT.GetNameDef]§! now, with the discipline of [520.GetName] and the hunger of the deep, and every village between the Colorado and the sea has heard what became of the Son of Mars."
  # ---- Round 27, Act V: REPLACEMENT descriptions for kept focuses that absorbed a deleted one (replace the existing values)
  mltd_ces_what_the_river_carries_desc:0 "The Colorado runs down out of the lands of [CES.GetNameDef] and empties into the Sea of Cortez, and whatever reaches the sea belongs, in the end, to §Y[MLT_MLULU.GetName]§!. So the Coral Court sends its oracles upriver against the current, as salt-sellers, ferrymen and lepers no legionary cares to look at twice, to count the crosses along the roads to §Y[520.GetName]§!. [CES_caesar.GetName]'s §Yfrumentarii§! are the finest spy-catchers in the wasteland, and they found our salt-sellers within a season. One of them followed an oracle down to the river at dusk to cut her throat, and was pulled under instead. Three days later he walked out of the shallows, dripping and perfectly calm, and went home to report to his masters. It was an excellent report, and every word of it came from the Coral Court. So will the next one."
  mltd_ces_the_sea_against_mars_desc:0 "[CES_caesar.GetName] calls himself the §YSon of Mars§!, and his legions believe it. So our converts in the slave pens and the legionary camps whisper something else: that Mars is a small god, a dry god, a god who has never once looked upon the sea. Meanwhile the drowned frumentarius knows which quartermasters drink and which supply wagons take the canyon road without an escort, and on the eve of war the depots of [CES.GetNameDef] empty a crate at a time; for every missing crate a guard goes up on a cross. If [CES_caesar.GetName] still lives, every legionary will wonder why his god needs the help. If he is dead, his heirs will drown one another for his chair. And when the whispering is done the tide comes up the Colorado, and the river carries every one of the drowned down to §Y[MLT_MLULU.GetName]§!."
  mltd_bos_the_drowned_paladin_desc:0 "A [BOS.GetAdjective] patrol was lost at sea far to the south, and the currents carried one of its dead all the way to [358.GetName]: a Paladin, face down on the black sand, his power armour full of brine and small pale crabs, a steel-bound Codex chained to his belt. Three weeks later he walked back through the blast doors of §Y[BOS.GetName]§!, gave the countersign without a flaw and reported that nothing was wrong. He does not take off his helmet. He does not eat in the mess. At night the scribes who share his corridor dream of green water, and wake with the Codex's cipher unpicked in their heads: what [BOS.GetNameDef] keeps, and where, and how it is guarded. The Elders have begun to hunt for a traitor. They are looking in the wrong direction."
  mltd_bos_blood_in_the_water_desc:0 "Steel and the bear circled each other for longer than the tribe has known its queen's name, and whatever is left of that quarrel the Coral Court means to use: an order that was never given, an [NCR.GetAdjective]-issue rifle beside a dead Initiate, a [BOS.GetAdjective] insignia pried from a burned Ranger outpost. Our sleeper forges the orders, and the drowned Paladin opens the lower armoury for the rest. Laser rifles and power armour go north by the old smugglers' roads, and their drivers are found in dry culverts, drowned in a place with no water. §Y[MLT_MLULU.GetName]§! does not care whom [BOS.GetNameDef] blames. Every war on the land sends its dead down the rivers to the sea, and now the tide comes up the rivers for the living."
  mltd_wht_the_lake_god_answers_desc:0 "§Y[WHT.GetNameDefCap]§! were driven from their sacred lake by [NCN.GetNameDef], and they still dream of returning to perform their rites on the spiral of stone that curls out into its salt. A lake is only a sea that has lost its way home. When our oracles pray to the [WHT.GetAdjective] God of the Lake, for the first time in generations, he answers - and the [WHT.GetAdjective] shamans, who read the future in salt and blood, begin to come to our fires to hear how. Meanwhile [EHT.GetNameDef] and [WHT.GetNameDef] raid each other across the Utah roads as they always have, and the Order has salvaged guns to spare. Sold to both at a good price, those guns will keep the road war burning long after we have spent the caps."
  mltd_wht_rites_on_the_spiral_jetty_desc:0 "[EHT.GetNameDefCap] worship the road and the machines that ride it, and a few spoonfuls of lake sand in the right tanks have left their great war-rides out of [478.GetName] stalled in the desert, their armouries strangely light. While [WHT.GetNameDef] and [EHT.GetNameDef] bleed each other on the salt flats, our priests walk out along the old spiral of black stone into the Great Salt Lake and wade in to the waist. Whatever [WHT.GetNameDef] called the god of that water, it has a new name now, and the name is ours. Let both sides of the road war come to the shore to find out what it wants of them."
  mltd_hea_whispers_in_the_steam_desc:0 "Far to the east, in the hills the old maps call Idaho, §Y[HEA.GetNameDef]§! pray to God and to the Great Steam that rises from the earth. But steam is only water that has forgotten what it is. Our oracles listen at the vents beneath their cathedrals, and in the hiss they hear the same voice that speaks to them out of the tide. [HEA.GetNameDefCap] were one church with [HGH.GetName] until the Schism tore them apart, and a church that has broken once breaks more easily the second time: our converts in the choirs sing the old hymns half a tone flat, and teach that the Steam does not rise from Heaven at all, but from the drowned places beneath it."
  mltd_hea_the_crusade_turns_south_desc:0 "A zealot must always have an enemy, and it is the easiest thing in the world to turn his eyes away from the sea. Let [HEA.GetNameDef] march on the Latter-day heretics of Utah. While the columns are away the boilers of Idaho are poorly guarded, and what the clergy will not share their storehouses can be persuaded to lose: rifles, gauges, and the plans that go with them. Then the tide follows in the wake of the crusade, gathers up whatever it leaves behind, and comes for the crusaders themselves."
