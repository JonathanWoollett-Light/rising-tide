  mltd_deep_ones_summon_replaced_tt:0 "§GSummon the Deep Ones§! is retired - the Deep Ones can now be raised in the field, and the sea answers only to the call of the §GStar Spawn§!"
  mltd_offering_of_the_drowned:0 "The Drowned Hoard"
  mltd_offering_of_the_drowned_desc:0 "A thousand of the faithful walk out at low tide with stones in their arms, from whichever of our lands can spare them. The sea keeps them, and gives back what it took from every ship it ever swallowed - strongboxes, rings, and caps by the sackful, crusted and stinking of salt."
  mltd_offering_of_the_tides:0 "Drown the Fields"
  mltd_offering_of_the_tides_desc:0 "Fifteen hundred are given to the channel where the old river met the sea, and the water answers by rising. Fresh springs break open through the silt of §YM'lyeh§! and do not close again."
  mltd_offering_state_pop_3000_tt:0 "One of our states holds more than §Y3,000§! people to give"
  mltd_offering_drowned_cooldown_tt:0 "The sea has not finished counting its dead. Days until it will trade again: §Y[?mltd_offering_drowned_cooldown:days_left|0]§!"
  mltd_offering_drowned_cooldown_after_tt:0 "The sea will not trade again for §Y60§! days"
  mltd_offering_tides_cooldown_tt:0 "The channel is still swollen from the last offering. Days until it will rise again: §Y[?mltd_offering_tides_cooldown:days_left|0]§!"
  mltd_offering_tides_cooldown_after_tt:0 "The waters will not rise again for §Y180§! days"
  ### Round 10: Feed the Spawning Pools as a continuous focus
  mltd_continuous_spawning_pools:0 "§eFeed the Spawning Pools§!"
  mltd_continuous_spawning_pools_desc:0 "The brood pits under the Crowlands are always hungry, and a hungry brood grows slowly. Drive the herds into the shallows, dredge the beds and keep the hatchlings gorged: a fat spawning is a cheap one. Mirelurks, Deep Ones and Star Spawn all cost less to raise for as long as the pits are kept full."
  continuous_mltd_spawning_pools:0 "§eFeed the Spawning Pools§!"
  continuous_mltd_spawning_pools_desc:0 "The brood pits are kept swollen with meat all year round."
