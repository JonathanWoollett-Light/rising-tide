  # ---- Round 27, Act III "The Stars Are Right": the close, its idea and its events (mltd_act3_focus.txt)
  mltd_the_tide_turns_south:0 "The Tide Turns South"
  mltd_the_tide_turns_south_desc:0 "Brotherhood, raider and bone-dancer: whether they came down to the water as allies or as corpses, the peoples of the north have given their answer, and it was the tide's. From the Sound to the redwood coast every harbour keeps time to the drums of §Y[MLT.GetNameDef]§!. Now the drums are changing their beat. Night after night the oracles turn their faces south, toward the dry hills of California and the republic that has never once looked toward the sea. The stars are right, the north is ours, and the tide has only begun to come in."
  mltd_tide_turns_south_states_tt:0 "Controls at least §Y50§! states"
  mltd_the_northern_waters:0 "The Northern Waters"
  mltd_the_northern_waters_desc:0 "One shore, one tide, one faith. The tribes, brotherhoods and raider crews that once fought over every cove from the Sound to the redwoods now kneel together in the surf at dusk, and the coast that bred them has become a single drowned country. It no longer needs to look behind it. It looks south."
  mltd.30.t:0 "$mltd_the_tide_turns_south$"
  mltd.30.d:0 "For three nights the drums of the Coral Court kept the old rhythm of the north - the slow count of the tide coming in over the flats. On the fourth night the rhythm changed. No one ordered it. The drummers say their hands simply found a new beat, harder and quicker, and when they looked up from their skins they were all facing the same way: §csouth§!.\n\nThe oracles have walked the drowned north from end to end, from the burrows of §o[235.GetName]§! to the raider harbours of the strait, and everywhere they went the water answered to §o[MLT_MLULU.GetName]§!. There is nothing left in the north to take. But far to the south, beyond the redwoods and the dry hills, lies a republic of dust and ballots whose people have never once looked toward the sea. They count their citizens by the million, the traders say, and every one of them drinks from a river. §cEvery river runs to the sea§!."
  mltd.30.a:0 "The tide turns south."
  mltd.30.b:0 "Every river runs to the sea."
  mltd.31.t:0 "Drums in the North"
  mltd.31.d:0 "The last free harbours of the north have fallen silent. Traders coming down the coast road tell of villages where every door bears the same coral sigil, and of brotherhoods, raider crews and tribes that were at one another's throats a year ago and now kneel together in the surf at dusk. The crab-worshippers of §o[MLT.GetNameDef]§! hold the whole northern shore, from the Sound to the redwoods.\n\nOn still nights the sentries of the California border swear they can hear drums coming down out of the fog - a hard, quick rhythm, like men marching. The caravan companies have stopped sending wagons north of the redwoods. Of the last few that went, one came back, its drivers soaked to the skin on a dry road, and §cnone of them will say what they saw on the beaches§!."
  mltd.31.a:0 "Double the watch on the northern roads."
