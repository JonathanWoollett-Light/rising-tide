  # mltd.51's two ideas (mltd_legion_pens_freed / mltd_legion_pens_fed); the Emptied Pens last 730 days, "two years" here and in mltd.51.d
  mltd_the_unchained:0 "The Unchained"
  mltd_the_unchained_desc:0 "The collars came off at the water's edge below [520.GetName], and the chained walked into the surf and came back up as the faithful. Now they walk the Legion's old roads with salt in their hair, and in every town that once sold them they preach the tide to the people who bought them. The conquered towns settle faster for it, and the tribe sleeps easier knowing that its newest children chose the sea."
  mltd_the_pens_emptied:0 "The Emptied Pens"
  mltd_the_pens_emptied_desc:0 "The pens of [520.GetName] were emptied into the spawning pools as they stood, and the pools have never been so full. For two years the brood-mothers can barely keep up: every clutch is larger than the last, and what hatches is ready for the host sooner than it has any right to be."
