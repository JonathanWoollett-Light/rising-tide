  ### Books of M'lyeh, gift unlocks, events mltd.7-8
  mltd.7.t:0 "Call of the Deep Ones"
  mltd.7.d:0 "At the turning of the tide the drums fell silent, and in the silence the Crowlands heard the answer. They came up through the shallows in long grey ranks - slick-skinned, unblinking, cold as the trench they were called out of - and knelt in the surf before the coral gates. The oracles say these are no hatchlings of any spawning pool but the elder children of §oM'lyeh§!, who wore the shapes of men once and gave them back to the sea. §oM'lulu§! has called them by name, and they have come to be counted in her host. The tribe already knows what to call them. The coast will learn: the §cDeep Ones§!."
  mltd.7.a:0 "They rise at her word."
  mltd.8.t:0 "The Deep Ones Walk"
  mltd.8.d:0 "They wait for no summons now. At dusk they walk up out of the surf, in numbers the oracles no longer tally, and take their places in the queen's ranks as though they had always stood there. Along the coast the villages have stopped lighting their night-fires, for fear of what the light might show. And behind the grey ranks, where the water is deepest and the fog will not lift, something else has begun to stir - vaster than any Deep One, older than the sea that hides it, come down out of the sky when the world was young. §oM'lulu§! has spoken its name into the dark, and the first of the §cStar Spawn§! has opened one eye."
  mltd.8.a:0 "Let the coast learn to fear the dusk."
  mltd_first_book:0 "The Book of the Tide"
  mltd_first_book_desc:0 "The first of the five Books of M'lyeh lies where the Apostles kept it, beneath the altar-stone at §YArago§!: a slab of black coral grown over with a script that wets itself to be read. It speaks of the ebb and of the flood, and of what the water carries back to those who feed it."
  mltd_second_book:0 "The Book of the Shell"
  mltd_second_book_desc:0 "The second Book was dragged down into the burrows of §YThe Warren§! long ago and gnawed at by things that could not read it. What remains is scratched onto plates of carapace nested one inside the next, and the innermost plate is still warm to the touch."
  mltd_third_book:0 "The Book of the Current"
  mltd_third_book_desc:0 "The third Book waits at the bottom of §YPaisley Pit§!, where the Marrow Drinkers cast it, and the pit has whispered to them every night since. It tells of a current that runs beneath all other currents, and of how a thousand minds may be turned by it as one."
  mltd_fourth_book:0 "The Book of the Brood"
  mltd_fourth_book_desc:0 "The fourth Book was never lost. The elders of §YArroyo§! have read from it for two hundred years and called it scripture, never once looking closely at the spawning pools it describes, nor at the shapes their children have lately begun to take."
  mltd_fifth_book:0 "The Book of the Abyss"
  mltd_fifth_book_desc:0 "The last Book has no pages. It is the thing that sits in the drowned harbour at §YThe Maw§!, and Port Maw's people have built their city around it without ever asking what it is. To read it, §YM'lulu§! must go down to it herself - and what is read there cannot be unread."
  mltd_tide_gift_unlocked_tt:0 "Unlocks the §YGift of the Tide§! decision."
  mltd_shell_gift_unlocked_tt:0 "Unlocks the §YGift of the Shell§! decision."
  mltd_current_gift_unlocked_tt:0 "Unlocks the §YGift of the Current§! decision."
