  ### Round 27, Act VI - All Waters Are One (common/national_focus/mltd_act6_focus.txt)
  mltd_the_southern_deep:0 "The Southern Deep"
  mltd_the_southern_deep_desc:0 "[CES.GetName] is broken, and the Colorado runs free to the Sea of Cortez at last, carrying the bones of Mars down with it. Now the oracles of the Coral Court turn their faces south, where the water is warmer and much older. Three powers still stand between the two gulfs, and §Y[MLT_MLULU.GetName]§! has dreamed of each of them: the oilmen of Texas, who drill past the oil into a black water that sings back up the pipe; §Y[ATE.GetNameDef]§!, whose blind Speaker has woken from the same nightmare every night for ten years; and the copper lair beneath old Mexico where §Y[TLA_tlaloc.GetName]§! forgets himself one memory at a time. All waters are one water, and all of it runs, in the end, to her."
  mltd_ate_the_feathered_tide:0 "The Feathered Tide"
  mltd_ate_the_feathered_tide_desc:0 "[ATE.GetNameDefCap] marches under the banner of the Feathered Serpent, and its blind Speaker has not slept a whole night in ten years. A dream of the iron god's death, and of the chaos after it, comes to her again and again, and her court has learned to fear whatever she foresees. Our oracles have listened to that dream from a thousand miles away, and they have begun, very gently, to change it. The serpent on her banner, the Speaker now tells her priests, was never a creature of the sky. It came up out of the sea. Meanwhile the Order walks in by the harbour gate. The Speaker's own spies are brutes who look for knives and never for fishermen, and her navy - the misfits the rest of the Empire calls the Frogs - has always been glad of a crew that can hold its breath."
  mltd_ate_the_serpent_drowns:0 "The Serpent Drowns"
  mltd_ate_the_serpent_drowns_desc:0 "Every child in [ATE.GetNameDef] knows that the Feathered Serpent went away over the eastern sea and promised to return. The Coral Court has taught the Speaker's priests the rest of the story: that the serpent went down into the water, and that what comes back out of the water is never what went in. Now the priests preach it in the plazas, the Eagle Knights and the Jaguars quarrel over what it means, and the levies stand on the shore at dusk and look at the sea with new eyes. When the tide comes up the southern rivers, half of [ATE.GetNameDef] will be waiting on the banks to welcome it home. The other half will drown."
  mltd_the_last_king_kneels:0 "The Last King Kneels"
  mltd_the_last_king_kneels_desc:0 "The south had many kings: a machine that called itself a god, a blind Speaker under a feathered banner, and the hard men of Texas who swore on their flag that they would never kneel to anyone. The Texans held out longest. Now their last guns are stacked in the red dust, and the Coral Court has sent for whoever still gives orders among them. He will walk down into the Gulf of his own accord, as far as his chest, and kneel as the faithful kneel, and the tide will do the rest. From the Gulf to the Sea of Cortez no army is left that can hold the water back for long, and the wealth of the south - its oil, its steel and its people - is already flowing north to §YM'lyeh§!."
  mltd_tex_texas_gone_tt:0 "Neither §Y[TBH.GetName]§! nor §Y[LNS.GetName]§! stands any more: the pilgrims find only the wells, and the wells are already listening."
  mltd_ate_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[ATE.GetName]§! wither §Ghalf as fast§!."
  mltd_ate_speaker_dreams_tt:0 "§Y[ATE_speaker_yesenia_aztlanl.GetName]§! still rules §Y[ATE.GetNameDef]§!, and now she dreams of the sea:"
  mltd_ate_gone_tt:0 "§Y[ATE.GetName]§! no longer stands against us: its feathered banners lie in the mud, and the Order gathers up the Speaker's dreams where they fell."
  mltd_ate_frogs_tt:0 "§Y[ATE.GetNameDefCap]§! has taken §Y$ate_serpent_rises$§!: our $mltd_deep_ones$ have swum beneath the keels of §Y[ATE_gail_kinkaid.GetName]§!'s Frogs, and their charts come home to us:"
  mltd_ate_serpent_gone_tt:0 "§Y[ATE.GetName]§! no longer stands against us: the serpent drowned without our help, and the priests who foretold it are ours."
  mltd_texas_beaten_tt:0 "Texas is beaten: §Y[TBH.GetName]§! and §Y[LNS.GetName]§! have each capitulated, bowed to us as a subject or are no more"
  mltd_the_drowned_south:0 "The Drowned South"
  mltd_the_drowned_south_desc:0 "Oil from the wells of Texas, steel from the southern forges and the labour of a hundred drowned towns come north to §YM'lyeh§! along rivers that no longer run to the sea, but out of it."
  mltd.60.t:0 "$mltd_the_southern_deep$"
  mltd.60.d:0 "The oracles came down from the House of Shells at the dark of the moon, weeping salt. For three nights they had knelt beside the southern pools, where the warm current comes up out of the Sea of Cortez, and for three nights the water had carried voices to them. A machine that is dying, and dreams in copper and static. A blind woman in a feathered palace, who wakes every night from a drowning and tells no one. Drillers on the Texan plains who have sunk their shafts too deep, and stopped sleeping. §o[MLT_MLULU.GetName]§! has heard them all. The south, the oracles say, has been listening to §cher§! for longer than it knows. It is time the south was answered."
  mltd.60.a:0 "Then let the tide turn south."
  mltd.61.t:0 "$mltd_the_last_king_kneels$"
  mltd.61.d:0 "They brought the last commander of Texas to §o[MLT.Capital.GetName]§! in a cage of driftwood, and he did not look at the sea once on the long road west. At the coral gates the Court let him out. He walked down into the surf of his own accord, as far as his chest, and knelt, and the water closed over him, and the whole tribe waited on the shore in perfect silence for as long as it takes the tide to turn. When he stood up again his eyes had forgotten how to blink. He faced the shore and spoke in a voice the oracles knew at once: §cthe south is hers§!. Then he turned and walked back out, and down, and did not come up again. The tribe went home singing. The oil of the Texan wells, the steel of the southern forges and the labour of a hundred drowned towns flow north to §oM'lyeh§! now, and its scholars have more to read than ever."
  mltd.61.a:0 "All waters are one."
  mltd.62.t:0 "The South Has Drowned"
  mltd.62.d:0 "The radio stations of the Gulf coast have gone quiet one by one, and the last of them to broadcast played nothing in its final hour but the sound of surf. Refugees streaming out of Texas tell the same story at every checkpoint: the armies of §o[MLT.GetNameDef]§! came up the rivers at night, and behind them the rivers rose. Oil wells that were capped two centuries ago have begun to flow again - black water, not oil - and the men who tend them no longer come home at dusk. From the Rio Grande to the Sea of Cortez the fishermen say the tide now comes in at the new moon and never goes fully out. Nobody who has been south this season will say what is worshipped there now. §cNobody needs to.§!"
  mltd.62.a:0 "Then the whole south is lost."
  ### Round 27, Act VI: replacement descriptions of kept focuses that absorbed a merged focus
  mltd_tex_all_waters_are_one_desc:0 "Texas is a long way from [358.GetName], and a dry one. But the Gulf laps at its southern shore, and the Gulf is only the sea under another name; the brown rivers that wind up through the prairie to [892.GetName] and [921.GetName] still taste of salt. Whatever the sea touches, §Y[MLT_MLULU.GetName]§! hears. The Order sends its quiet pilgrims east along the old roads - peddlers, fishermen, a preacher who never seems to blink - and some of them stay on as clerks in the counting-houses of the §Y$texan_economic_union$§!. They keep the ledgers in a neat, damp hand, never ask for wages and never miss a meeting, and they listen. Now and then a column of figures does not quite add up, and the difference goes west on the tide."
  mltd_tex_black_water_rising_desc:0 "However Texas is ruled now - a Republic under the Lone Star, one power standing on its rival's grave, or two partners still haggling over the Union's ledgers - its masters have done what every master of dry country does: they have started to dig. Their wells go deeper than any the old world sank, past the oil and the brine into a black water that is neither. Our clerks followed the ledgers to the well-heads, and now they keep those too. After a hard rain the Trinity runs high past the Texan depots, and on those nights the supply barges founder where the channel is deepest; the bargemen who swim ashore swear that something took hold of the hull from underneath and pulled. What rises from the wells in the night is sealed in drums and sent west with the salvage, and the drillers who stare too long down the shafts begin to dream of a green-lit city under the sea. The black water beneath Texas and the black water beneath §YM'lyeh§! were always one water."
  mltd_tla_the_iron_god_dreams_desc:0 "Far to the south, in a lair of copper and cold light beneath old Mexico, a god that men built is forgetting itself one memory at a time. What it loses does not simply vanish. It bleeds out along the old §YChicoNet§! wavebands as static, and in the static there are dreams. The oracles of the Coral Court have listened to a sleeping god all their lives, and they know the sound of another one dreaming. They write down what the dying machine says in its sleep, and the Order's whisperers carry it to the three voices that argue over his throne - an emperor's, a priest-king's and a rebel's - speaking to each in turn, softly, in the slow cadence of the tide, until none of them is quite certain which thoughts are its own. If the iron god is already dead, the voices wear crowns now, and kings are easier still to whisper to."
  mltd_tla_the_drowned_god_sleeps_desc:0 "The drowned god sleeps while the iron god dies, and only one of them will ever wake. The oracles know the shape of the machine's dreams now, and they pour their own into it - the tide, the dark, the long cold patience of the deep - until there is less and less room left in the iron god for himself. A dying god keeps poor watch over its armouries, too: while his sentries forget their orders halfway through a patrol, the Order's quiet folk ride the coastal barges south and come home with crates. Whatever he forgets, the Order catches and keeps. If he is already gone, his last dreams still drift through the wreck of the §YChicoNet§!, and the dead are even easier to rob than the dying."
