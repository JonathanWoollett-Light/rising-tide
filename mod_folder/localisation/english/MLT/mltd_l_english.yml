  ### Round 21: the Broken Coast (mltd_brk_*, in Acts II and III since round 27), its volunteers and the Drowned Covenant (mltd.21-23)
  mltd_brk_salt_on_the_broken_coast:0 "Salt on the Broken Coast"
  mltd_brk_salt_on_the_broken_coast_desc:0 "The whole wasteland spits on §Y[BRK.GetNameDef]§!: raiders, slavers, wreckers who live off whatever the grey sea throws onto their rocks. We do not spit. The sea that feeds them is ours, and their longships already cross water where our children swim. Envoys with wet hands and quiet voices will sail north with gifts of salt and pearls, and priests will sail with them. Raiders drown; it is the one thing every crew knows for certain about its own end. Our priests will teach them that drowning is not an end at all - and the men who went over the side and came back, coughing, changed, their eyes gone dark, will preach it on the decks for us."
  mltd_brk_the_deep_ones_sail_north:0 "The Deep Ones Sail North"
  mltd_brk_the_deep_ones_sail_north_desc:0 "The raiders fight on every shore at once, and they are losing men faster than their shacks can breed them. We can spare what they cannot. Let our warriors and the $mltd_deep_ones$ swim north under the raiders' keels as volunteers and come ashore wherever [BRK.GetNameDef] point their axes, fighting in their name, for their coast - and when one of the $mltd_star_spawn$ wades out of the strait onto an enemy beach behind them, the raiders will not need to be told whose god fights at their side. A people who owe us their victories will not easily forget whose children won them."
  mltd_brk_the_drowned_covenant:0 "The Drowned Covenant"
  mltd_brk_the_drowned_covenant_desc:0 "Half the crews on that coast pray to the deep, and the rest owe money to men who do. Our agents sit at the raider chiefs' fires and know their debts and their dreams. The time for gifts is over. Let [BRK.GetNameDef] swear themselves to M'lyeh as allies under one black flag, and let every shore from the Sound to the strait belong to the drowned.\n\n[GetMltdBrkOdds]"
  mltd_brk_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[BRK.GetName]§! wither §Ghalf as fast§!."
  mltd_brk_volunteer_size_tt:0 "We may send §G3§! more volunteer divisions to countries at war - [BRK.GetFlag]§Y[BRK.GetNameDef]§! first among them - with no world tension needed (§Y$mltd_brk_volunteers$§!)"
  mltd_brk_volunteers:0 "The Tide Sails North"
  mltd_brk_raiders_cult_tt:0 "The cult of §YM'lyeh§! in §Y[BRK.GetName]§! grows by §G10%§! (founded if it has none)"
  mltd_brk_strong_cult_tt:0 "The cult of §YM'lyeh§! in §Y[BRK.GetName]§! stands at §Y40%§! or more"
  mltd_brk_network_tt:0 "Network National Coverage in [BRK.GetFlag] §H[BRK.GetNameDefCap]§! More than 25%"
  mltd_brk_covenant_offer_tt:0 "[BRK.GetFlag]§Y[BRK.GetNameDefCap]§! are invited to join our faction, §Y$mltd_drowned_covenant$§!."
  mltd_drowned_covenant:0 "The Drowned Covenant"
  mltd_drowned_envoys:0 "Envoys from the deep"
  mltd_drowned_covenant_refused:0 "Refused the Drowned Covenant"
  mltd.21.t:0 "An Offer from the Deep"
  mltd.21.d:0 "The envoys came ashore at dawn, as they always do, wet to the waist and in no hurry. This time they brought no salt and no pearls. They brought the word of §o[FROM.GetNameDef]§!: the coast we fought for is ours, and the things that swim beneath our keels will keep swimming for us - if we swear ourselves to §c$mltd_drowned_covenant$§!.\n\nHalf the chiefs at the fire already pray to the deep. The other half are watching them, and counting the dark-eyed men in their own crews."
  mltd.21.a:0 "The coast and the deep are one. We swear."
  mltd.21.b:0 "Raiders bow to no one. Send them back to the water."
  mltd.22.t:0 "The Black Flag and the Deep"
  mltd.22.d:0 "The chiefs of §o[FROM.GetNameDef]§! swore on the shingle with their feet in the surf, and the tide came in over their oath. From the Sound to the strait the longships now fly a black flag with a drowned sigil sewn beneath the skull, and the crews sing our hymns at the oars.\n\n§c$mltd_drowned_covenant$§! is sworn."
  mltd.22.a:0 "Every shore belongs to the drowned."
  mltd.23.t:0 "The Raiders Refuse"
  mltd.23.d:0 "Our envoys came back with their gifts in their arms. The chiefs of §o[FROM.GetNameDef]§! heard them out, laughed, and told them that raiders bow to no king, not even one beneath the sea.\n\nThe faithful among their crews were not laughing. The insult gives us cause against the raiders §cfor a year§!; after that, §cthe deep is patient§!."
  mltd.23.a:0 "The deep is patient."
  ### Round 22: the Bone Dancers (mltd_bdt_*, in Acts II and III since round 27) and the Covenant's second invitation (mltd.24-26)
  mltd_bdt_the_bone_shore:0 "The Bone Shore"
  mltd_bdt_the_bone_shore_desc:0 "Inland of us the roads are marked with painted skulls, and §Y[BDT.GetNameDef]§! dance along them to a music only they can hear. Raiders, every one - but raiders who kneel to a king, and a people who dance for a dead thing are halfway to ours already. Send envoys with salt and pearls, and let the Order listen to the music."
  mltd_bdt_the_dancers_hear_the_tide:0 "The Dancers Hear the Tide"
  mltd_bdt_the_dancers_hear_the_tide_desc:0 "Their drums keep the time of marching feet. Our priests have begun to beat a slower rhythm beneath it - the rhythm of water on stone - and some of the dancers have started to keep that time instead. They dream of a drowned hall and a crown of coral, and they wake still dancing. The faithful among them know where the bone road runs, too: it carries every gun [BDT.GetNameDef] own, close enough to the water that a crate can go missing between one painted skull and the next. Whether we end as their allies or their heirs, those crates are better in our hands."
  mltd_bdt_hail_the_drowned_king:0 "Hail the Drowned King"
  mltd_bdt_hail_the_drowned_king_desc:0 "[BDT.GetNameDefCap] dance for a king, and it matters little which one: a man on a rotting throne inland is a small thing beside the one who waits beneath the water, and the faithful among the dancers have been saying so for a year. Only the seraph lords could spoil it - a people who have taken the pilgrims' road (§Y$bdt_listen_to_the_pilgrims$§!) are promised elsewhere. Invite them into §Y$mltd_drowned_covenant$§!, king and all.\n\n[GetMltdBdtOdds]"
  mltd_bdt_drown_the_dance:0 "Drown the Dance"
  mltd_bdt_drown_the_dance_desc:0 "The music stops. Their king is a corpse propped up by frightened men, their roads run where our water wants to go, and our scouts already know which camps sleep unguarded. There will be no invitation - only the tide."
  mltd_bdt_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[BDT.GetName]§! wither §Ghalf as fast§!."
  mltd_bdt_dancers_cult_tt:0 "The cult of §YM'lyeh§! in §Y[BDT.GetName]§! grows by §G10%§! (founded if it has none)"
  mltd_bdt_not_pilgrims_tt:0 "[BDT.GetNameDefCap] have not sworn to the seraph lords (§Y$bdt_listen_to_the_pilgrims$§!), and we are not allied to [HEA.GetNameDef]"
  mltd_bdt_strong_cult_tt:0 "The cult of §YM'lyeh§! in §Y[BDT.GetName]§! stands at §Y40%§! or more"
  mltd_bdt_network_tt:0 "Network National Coverage in [BDT.GetFlag] §H[BDT.GetNameDefCap]§! More than 25%"
  mltd_bdt_covenant_offer_tt:0 "[BDT.GetFlag]§Y[BDT.GetNameDefCap]§! are invited to join our faction, §Y$mltd_drowned_covenant$§!."
  mltd.24.t:0 "A Crown Beneath the Water"
  mltd.24.d:0 "The envoys came up the bone road at dusk, wet to the waist as always, and waited at the edge of the firelight until the drums stopped. Then they spoke to the king on his propped throne, and to every dancer who had been dreaming of black water for a year: there is an older king, they said, who sleeps beneath the sea and dreams of every dancer on the shore, and his priestess-queen offers §c$mltd_drowned_covenant$§! to those who will dance for him.\n\nThe drummers have not started again."
  mltd.24.a:0 "Two kings, one music. We swear."
  mltd.24.b:0 "Our king rules the road. Send them back to their water."
  mltd.25.t:0 "The Dance Goes Down to the Water"
  mltd.25.d:0 "They came down the bone road in their hundreds, painted skulls and all, and danced into the surf until the water took the sound out of the drums. The king of §o[FROM.GetNameDef]§! knelt in it with the rest.\n\n§c$mltd_drowned_covenant$§! is sworn."
  mltd.25.a:0 "Let them dance on our shore."
  mltd.26.t:0 "The Drums Answer"
  mltd.26.d:0 "The king of §o[FROM.GetNameDef]§! heard our envoys out, laughed until he coughed, and had the drums beaten until they could no longer be heard over them. They will keep their road and their own dead king.\n\nThe faithful among the dancers kept the slower rhythm. §cThey will be waiting§!, and the insult gives our war-bands cause against the dancers §cfor a year§!."
  mltd.26.a:0 "The tide keeps better time."

  ### Round 26: the Leviathan
  mltd_leviathan:0 "Leviathan"
  mltd_leviathan_desc:0 "It has no hull, only hide; no guns, only what it does to hulls. It swims beneath the swell where no lookout thinks to watch, feeds on nothing any quartermaster can supply, and sails wherever §Y[MLT_MLULU.GetName]§! points."
  mltd_leviathan_hull:0 "$mltd_leviathan$"
  mltd_leviathan_hull_desc:0 "Not built but summoned: there is no part of it to fit, swap or improve."
  mltd_leviathan_1:0 "$mltd_leviathan$"
  mltd_leviathan_1_short:0 "$mltd_leviathan$"
  mltd_leviathan_1_desc:0 "A capital ship in the only sense that matters: it sinks capital ships. It rises from the deep beneath §YM'lyeh§!, burns no energy cells, keeps the sea for months together, cares nothing for the weather and is all but invisible until it surfaces among the enemy fleet. No dockyard can lay one down."
  mltd_leviathan_tech:0 "The $mltd_leviathan$"
  mltd_leviathan_tech_desc:0 "§Y$mltd_the_grand_ritual$§! has thinned the world, and something under the reef off §Y$VICTORY_POINTS_7064$§! has turned over in its sleep. Beneath the drowned city there are older things than the §Y$mltd_deep_ones$§!, and some of them are very large. The oracles say the first one slept through the bombs.\n\nIt cannot be researched, only woken."
  mltd_leviathan_mireport_tt:0 "We control §Y$VICTORY_POINTS_7064$§!, where the $mltd_leviathan$ surfaces"
  mltd_spawn_leviathan_tt:0 "A §Y$mltd_leviathan$§! surfaces at §Y$VICTORY_POINTS_7064$§!: a capital ship with no parts to fit, that burns no energy cells and can never be built - only summoned"
  # round 28c review: the Grand Ritual tests Mireport again when it completes, so both of its lines say so, as Return to the Sea's do
  mltd_grand_ritual_leviathan_tt:0 "If we still hold §Y$VICTORY_POINTS_7064$§! when the ritual completes, the first §Y$mltd_leviathan$§! surfaces there, the pride of the fleet: a capital ship with no parts to fit, that burns no energy cells and can never be built - only summoned. If it is lost by then, none surfaces, and the first one summoned will be the pride of the fleet"
  mltd_leviathan_no_mireport_tt:0 "We do not hold §Y$VICTORY_POINTS_7064$§!, so no §Y$mltd_leviathan$§! surfaces unless it is ours again when the ritual completes; otherwise the first one summoned will be the pride of the fleet"
  mltd_leviathan_decision_unlocked_tt:0 "Unlocks the §Y$mltd_summon_the_leviathan$§! decision."
  mltd_summon_the_leviathan:0 "Summon the Leviathan"
  mltd_summon_the_leviathan_desc:0 "Twenty-four thousand souls are rowed out past the reef at §Y$VICTORY_POINTS_7064$§! and given to the water, every one of our lands paying its share. The bay boils, and something vast comes up to take its place in the fleet: another §Y$mltd_leviathan$§!, as old as the one before it and just as hungry."
  mltd_summon_state_pop_leviathan_tt:0 "The lands we still hold number more than §Y48,000§! - twice what the summoning takes"
  mltd_leviathan_toll_tt:0 "§Y24,000§! people in all are taken from the states we control, each giving in proportion to what it holds"
  mltd_leviathan_summon_cooldown_tt:0 "The deep has given what it will. Days until another $mltd_leviathan$ answers: §Y[?mltd_leviathan_summon_cooldown:days_left|0]§!"
  mltd_leviathan_summon_cooldown_after_tt:0 "No other $mltd_leviathan$ will answer for §Y180§! days"

  ### Round 27: the story acts (Acts II-VI and the finale, common/national_focus/mltd_act*_focus.txt and mltd_finale_focus.txt)
  # Act II "The Northern Waters" (mltd_act2_focus.txt): the Broken Coast's six volunteer divisions
  mltd_brk_volunteer_size_6_tt:0 "We may send §G6§! more volunteer divisions to countries at war - [BRK.GetFlag]§Y[BRK.GetNameDef]§! first among them - with no world tension needed (§Y$mltd_brk_volunteers$§!)"
  # Act III "The Stars Are Right" (mltd_act3_focus.txt): the close, its idea and events mltd.30-31
  mltd_the_tide_turns_south:0 "The Tide Turns South"
  mltd_the_tide_turns_south_desc:0 "Brotherhood, raider and bone-dancer: one by one the peoples of the north are giving their answer, as allies or as corpses, and every answer is the tide's. From the Sound to the redwood coast the harbours are learning to keep time to the drums of §Y[MLT.GetNameDef]§!. Now the drums are changing their beat. Night after night the oracles turn their faces south, toward the dry hills of California and the republic that has never once looked toward the sea. The stars are right, the north is falling to us, and the tide has only begun to come in."
  mltd_tide_turns_south_states_tt:0 "Controls at least §Y50§! states, or the year §Y2281§! has begun"
  mltd_the_northern_waters:0 "The Northern Waters"
  mltd_the_northern_waters_desc:0 "One shore, one tide, one faith. The tribes and raider crews that once fought over every cove from the Sound to the redwoods now kneel together in the surf at dusk, and the coast that bred them is becoming a single drowned country. It no longer needs to look behind it. It looks south."
  mltd.30.t:0 "$mltd_the_tide_turns_south$"
  mltd.30.d:0 "For three nights the drums of the Coral Court kept the old rhythm of the north - the slow count of the tide coming in over the flats. On the fourth night the rhythm changed. No one ordered it. The drummers say their hands simply found a new beat, harder and quicker, and when they looked up from their skins they were all facing the same way: §csouth§!.\n\nThe oracles have walked the drowned north from end to end, from the burrows of §o[235.GetName]§! to the raider harbours of the strait, and everywhere they went the water answered to §o[MLT_MLULU.GetName]§!. What is left in the north will fall of its own weight. But far to the south, beyond the redwoods and the dry hills, lies a republic of dust and ballots whose people have never once looked toward the sea. They count their citizens by the million, the traders say, and every one of them drinks from a river. §cEvery river runs to the sea§!."
  mltd.30.a:0 "The tide turns south."
  mltd.30.b:0 "Every river runs to the sea."
  mltd.31.t:0 "Drums in the North"
  mltd.31.d:0 "One by one the free harbours of the north have fallen silent. Traders coming down the coast road tell of villages where every door bears the same coral sigil, and of raider crews and tribes that were at one another's throats a year ago and now kneel together in the surf at dusk. The crab-worshippers of §o[MLT.GetNameDef]§! hold more of the northern shore every season, and the harbours they do not hold have stopped lighting their lamps.\n\nOn still nights the sentries of the California border swear they can hear drums coming down out of the fog - a hard, quick rhythm, like men marching. The caravan companies have stopped sending wagons north of the redwoods. Of the last few that went, one came back, its drivers soaked to the skin on a dry road, and §cnone of them will say what they saw on the beaches§!."
  mltd.31.a:0 "Double the watch on the northern roads."
  # Act IV "The Drowned Republic" (mltd_act4_focus.txt): the close, its idea and events mltd.40-41
  mltd_when_shady_sands_falls:0 "When [253.GetName] Falls"
  mltd_when_shady_sands_falls_desc:0 "Every city falls in the end; the sea has seen to that more often than anyone above the water remembers. When [NCR.GetNameDef] is broken, its people will scatter down the roads they built, and the faithful will be waiting on every one of them with a jar of brine and a kind word. Two things in the ruin will be worth more to the Coral Court than all the rest, and the oracles say the deep can take only one of them whole."
  mltd_ncr_beaten_tt:0 "§Y[NCR.GetNameDefCap]§! has capitulated, is no more, or is our subject"
  mltd_shady_sands_falls_choice_tt:0 "§YThe Coral Court claims one trophy from the ruin of the Republic:§!"
  mltd_shady_sands_falls_scholars_tt:0 "§YThe scholars of [253.GetName] serve the tide:§!"
  mltd_shady_sands_falls_rangers_tt:0 "§YOr the Rangers swear again, to the deep:§!"
  mltd.40.t:0 "When [253.GetName] Falls"
  mltd.40.d:0 "The bear flag has come down. §o[NCR.GetNameDefCap]§! is broken, and its people are on the roads - south, east, anywhere the water is still sweet. The faithful walk beside them. On the §oLong 15§! and down every caravan trail our converts hand out brine by the cup and ask nothing in return, and a great many of those who drink turn round and walk north, toward the coast.\n\nAmong them are two kinds of people the Coral Court has coveted for years. The first are the §cscholars§! of §o[253.GetName]§!: archivists, engineers and doctors, the keepers of everything the Republic learned and hoarded since the bombs. The second are the §cRangers§!, the long coats who swore to hold the desert for the Republic, could not hold it, and are looking now for something else to swear to.\n\nThe oracles say the deep can take only one of them whole. §o[MLT_MLULU.GetName]§! will not choose. Since she read the last Book she listens only to what stirs beneath the sea, and the living are the Court's to sort. §cThe Court must choose for her.§!"
  mltd.40.a:0 "The scholars of [253.GetName] will serve the tide."
  mltd.40.b:0 "Let the Rangers swear again, knee-deep in the surf."
  mltd.41.t:0 "The Bear Lies Down"
  mltd.41.d:0 "For as long as anyone alive can remember, §o[NCR.GetNameDef]§! was the one thing on the western coast that could not fall. It outlasted raiders and slavers, Khans and Brotherhoods, droughts, plagues and its own Congress. It has fallen now.\n\nThe refugees coming down out of California all tell the same stories, and the strangest are the ones told most often. They say the wells of §o[253.GetName]§! have turned to salt. They say the Rangers are nowhere to be found - not dead, most insist, but gone, walked off in the night toward the sea. They say grey men with wide, unblinking eyes walk the streets at dusk and nobody stops them, and that in the empty chamber on §oCouncil Hill§!, where the bear used to hang, someone has painted a sigil on the wall §cthat is always wet§!.\n\nIn the capitals that are left, envoys have begun to ask a question nobody wants to answer. If the Republic could drown, who cannot?"
  mltd.41.a:0 "Then the tide will not stop at California."
  mltd_the_drowned_rangers:0 "The Drowned Rangers"
  mltd_the_drowned_rangers_desc:0 "They swore to hold the desert for [NCR.GetNameDef], and they held it as long as anyone could have. Then the Republic fell out from under them, and the long coats went looking for something else to swear to. They found it in the surf at M'lyeh. The oath is the one it always was - walk the wastes, guard the weak, never give ground - but it is spoken to the water now, and the water answers. A Drowned Ranger still wears the coat and the helm. The coat is always wet, and nobody has looked behind the helm's red eyes since the night they swore."
  # Act V "The Sea Against Mars" (mltd_act5_focus.txt): the chapter, the close, the idea and events mltd.50-52
  mltd_mars_in_the_water:0 "Mars in the Water"
  mltd_mars_in_the_water_desc:0 "The bear lies drowned in its own wells, and the tide stands on the western bank of the Colorado. Across the water lie the lands of §Y[CES.GetNameDef]§!, and the first reports are already coming back up the river. For a generation [CES.GetNameDef] has taught the wasteland that its god is war. Now the wasteland will learn what war looks like to a god who lives beneath the water, and the Coral Court sends its oracles, its drowned and its drums up every river that runs into the Legion's land."
  mltd_when_the_legion_breaks:0 "When the Legion Breaks"
  mltd_when_the_legion_breaks_desc:0 "The Legion was built to break other peoples - tribes, towns, whole nations fed to the cross and the collar until nothing was left but the Legion. It was never built to be broken itself, and it does not know how. When its legates lie in the river mud and its crosses come down, the pens of §Y[520.GetName]§! will still be full: thousands of the chained, with no masters left to sell them. The Coral Court has already decided that they belong to the sea, and not yet how. And on the altar of Mars, where the Legion burned its offerings, the oracles have set a basin of salt water, and something has begun to kneel before it."
  mltd_legion_beaten_tt:0 "§Y[CES.GetNameDefCap]§! has capitulated, is no more, or is our subject"
  mltd_legion_breaks_choice_tt:0 "§YThe Coral Court decides the fate of the chained in the pens of [520.GetName]:§!"
  mltd_legion_breaks_freed_tt:0 "§YThe chained are freed into the tide:§!"
  mltd_legion_breaks_pens_tt:0 "§YOr the pens feed the spawning pools:§!"
  mltd.50.t:0 "The River Runs Salt"
  mltd.50.d:0 "The report came downriver on a raft of reeds, in the hand of an oracle who wears a ferryman's rags on the Colorado.\n\nThe scouts of §o[CES.GetNameDef]§! went down to the river at dawn to water their brahmin, and the beasts would not drink. A decanus waded in to his knees, cupped the water, tasted it and spat. It was §csalt§! - sea-salt, a hundred leagues from any sea - and since that morning it has run salt from the dam to the delta. The fish have not died. That frightens the legionaries more than anything else: the fish are thriving, there are more of them every day, and some of them are §cnot fish§!.\n\nIn §o[520.GetName]§! the augurs have opened bird after bird and will not say what they find. The frumentarii are hanging ferrymen along the river road. Our oracle writes that they have not yet hanged the right one, and that on the far bank, at night, the legionaries on watch have begun to pray to Mars in whispers, the way men pray to a god they are no longer sure can hear them."
  mltd.50.a:0 "Mars cannot swim."
  mltd.51.t:0 "The Pens of [520.GetName]"
  mltd.51.d:0 "The eagles are down. §o[CES.GetNameDefCap]§! is broken: its legates dead or kneeling in the river mud, its crosses pulled down along the roads, its war-god silent in his temple. What the Legion leaves behind is what the Legion always made most of - §cthe chained§!.\n\nThe slave pens of §o[520.GetName]§! and a hundred camps like them are full, and their masters are gone. Thousands stand behind the wire and watch the grey ranks of the $mltd_deep_ones$ walk in off the river, and they do not know yet whether they are being freed or only sold again.\n\nThe Coral Court has decided that they belong to the sea. It has not decided how. The collars can be struck off at the water's edge and the chained walked into the surf, to rise as the faithful of §oM'lyeh§! and carry the tide back to the towns that sold them - there are elders in the Court who say the tide was always meant to free them. Or the pens can be emptied as they stand into the spawning pools, which have grown very large and are §calways hungry§!, and for two years the brood-mothers will hatch the tribe's host faster than they ever have."
  mltd.51.a:0 "Strike off the collars. Let them rise as the faithful."
  mltd.51.b:0 "The spawning pools are hungry. Empty the pens."
  mltd.52.t:0 "The Bull Goes Down to the Sea"
  mltd.52.d:0 "§o[CES.GetNameDefCap]§! has fallen. For as long as anyone east of the Colorado can remember, the Legion was the thing that came in the night with crosses and chains, and no town that saw its banner ever saw its own flag again. Now the golden bull has gone down, and whatever pulled it down, it is the tide that has come up the Colorado to claim what was left.\n\nThe traders who come out of Arizona tell stories that nobody believes until the third or fourth telling. They say the river runs salt from the dam to the sea. They say the slave pens of §o[520.GetName]§! stand empty, their gates open and their wire hung with kelp, and that nobody can say where the chained have gone. They say that in the temple of Mars the altar has been §cfilled with sea water§!, and that the few legionaries left alive go down to the river at dusk, wade in to the waist, and stand there, listening.\n\nFirst the Republic, and now the Legion. Every capital still standing has done the same arithmetic, and none of them likes the answer."
  mltd.52.a:0 "Even Mars could not hold back the sea."
  mltd_mars_beneath_the_waves:0 "Mars Beneath the Waves"
  mltd_mars_beneath_the_waves_desc:0 "The war-god of [CES.GetNameDef] was dragged down into the green dark, and he has learned to swim. Legionaries who knelt to the tide march in the host of §Y[MLT.GetNameDef]§! now, with the discipline of [520.GetName] and the hunger of the deep, and every village between the Colorado and the sea has heard what became of the Son of Mars."
  # Act VI "All Waters Are One" (mltd_act6_focus.txt): the chapter, Nueva Aztlan's two focuses, the close, the idea and events mltd.60-62
  mltd_the_southern_deep:0 "The Southern Deep"
  mltd_the_southern_deep_desc:0 "[CES.GetName] is broken, and the Colorado runs free to the Sea of Cortez at last, carrying the bones of Mars down with it. Now the oracles of the Coral Court look further still, past the Colorado to the warm southern seas, where the water is much older. Three powers still stand between the two gulfs, and §Y[MLT_MLULU.GetName]§! has dreamed of each of them: the oilmen of Texas, who drill past the oil into a black water that sings back up the pipe; §Y[ATE.GetNameDef]§!, whose blind Speaker dreamed the iron god's death years before it was due; and the copper lair beneath old Mexico, where §Y[TLA_tlaloc.GetName]§! is forgetting himself one memory at a time - or has already forgotten the last, and left his heirs to fight over the bones. All waters are one water, and all of it runs, in the end, to her."
  mltd_ate_the_feathered_tide:0 "The Feathered Tide"
  mltd_ate_the_feathered_tide_desc:0 "[ATE.GetNameDefCap] marches under the banner of the Feathered Serpent. Its blind Speaker foresaw the iron god's death, and the chaos after it, years before either came, and the court has learned to fear whatever the palace dreams. Our oracles have listened to those dreams from a thousand miles away, and they have begun, very gently, to change them. The serpent on the banner, the priests have started to preach, was never a creature of the sky. It came up out of the sea. Meanwhile the Order walks in by the harbour gate. The Empire's own spies are brutes who look for knives and never for fishermen, and its navy - the misfits the rest of the Empire calls the Frogs - has always been glad of a crew that can hold its breath."
  mltd_ate_the_serpent_drowns:0 "The Serpent Drowns"
  mltd_ate_the_serpent_drowns_desc:0 "Every child in [ATE.GetNameDef] knows that the Feathered Serpent went away over the eastern sea and promised to return. The Coral Court has taught the Speaker's priests the rest of the story: that the serpent went down into the water, and that what comes back out of the water is never what went in. Now the priests preach it in the plazas, the Eagle Knights and the Jaguars quarrel over what it means, and the levies stand on the shore at dusk and look at the sea with new eyes. When the tide comes up the southern rivers, half of [ATE.GetNameDef] will be waiting on the banks to welcome it home. The other half will drown."
  mltd_the_last_king_kneels:0 "The Last King Kneels"
  mltd_the_last_king_kneels_desc:0 "The south has many kings: a machine that called itself a god, a blind Speaker under a feathered banner, and the hard men of Texas, who swore on their flag that they would never kneel to anyone. Now the Texans' last guns are stacked in the red dust, and the Coral Court has sent for whoever still gives orders among them. He will be brought west to the coral gates of §Y[MLT.Capital.GetName]§!, and the tide will do the rest. From the Gulf to the Sea of Cortez no army is left that can hold the water back for long, and the wealth of the south - its oil, its steel and its people - is already flowing north to §YM'lyeh§!."
  mltd_tex_texas_gone_tt:0 "Neither §Y[TBH.GetName]§! nor §Y[LNS.GetName]§! stands any more: the pilgrims find only the wells, and the wells are already listening."
  mltd_ate_cult_sheltered_tt:0 "Cults of §YM'lyeh§! in §Y[ATE.GetName]§! wither §Ghalf as fast§!."
  mltd_texas_beaten_tt:0 "Texas is beaten: §Y[TBH.GetName]§! and §Y[LNS.GetName]§! have each capitulated, bowed to us as a subject or are no more"
  mltd_the_drowned_south:0 "The Drowned South"
  mltd_the_drowned_south_desc:0 "Oil from the wells of Texas, steel from the southern forges and the labour of a hundred drowned towns come north to §YM'lyeh§! along rivers that no longer run to the sea, but out of it."
  mltd.60.t:0 "$mltd_the_southern_deep$"
  mltd.60.d:0 "The oracles came down from the House of Shells at the dark of the moon, weeping salt. For three nights they had knelt beside the southern pools, where the warm current comes up out of the Sea of Cortez, and for three nights the water had carried voices to them. A machine that is dying, or is dead and still dreams in copper and static. A feathered palace where a blind woman once foresaw that death, and where someone now wakes every night from a drowning and tells no one. Drillers on the Texan plains who have sunk their shafts too deep, and stopped sleeping. §o[MLT_MLULU.GetName]§! has heard them all. The south, the oracles say, has been listening to §cher§! for longer than it knows. It is time the south was answered."
  mltd.60.a:0 "Then let the south be answered."
  mltd.61.t:0 "$mltd_the_last_king_kneels$"
  mltd.61.d:0 "They brought the last commander of Texas to §o[MLT.Capital.GetName]§! in a cage of driftwood, and he did not look at the sea once on the long road west. At the coral gates the Court let him out. He walked down into the surf of his own accord, as far as his chest, and knelt, and the water closed over him, and the whole tribe waited on the shore in perfect silence for as long as it takes the tide to turn. When he stood up again his eyes had forgotten how to blink. He faced the shore and spoke in a voice the oracles knew at once: §cthe south is hers§!. Then he turned and walked back out, and down, and did not come up again. The tribe went home singing. The oil of the Texan wells, the steel of the southern forges and the labour of a hundred drowned towns flow north to §oM'lyeh§! now, and its scholars have more to read than ever."
  mltd.61.a:0 "All waters are one."
  mltd.62.t:0 "The South Has Drowned"
  mltd.62.d:0 "The radio stations of the Gulf coast have gone quiet one by one, and the last of them to broadcast played nothing in its final hour but the sound of surf. Refugees streaming out of Texas tell the same story at every checkpoint: the armies of §o[MLT.GetNameDef]§! came up the rivers at night, and behind them the rivers rose. Oil wells that were capped two centuries ago have begun to flow again - black water, not oil - and the men who tend them no longer come home at dusk. From the Rio Grande to the Sea of Cortez the fishermen say the tide now comes in at the new moon and never goes fully out. Nobody who has been south this season will say what is worshipped there now. §cNobody needs to.§!"
  mltd.62.a:0 "Then the whole south is lost."
  # The finale "R'lyeh Rises" (mltd_finale_focus.txt): R'lyeh Rises, the three endings, their ideas and events mltd.70-74
  mltd_rlyeh_rises:0 "R'lyeh Rises"
  mltd_rlyeh_rises_desc:0 "The stars came right when §Y$mltd_the_final_ritual$§! was sung. Now the land is ready too. From the Sound to the Rio Grande every shore the tribe has taken is one more verse of the same long song, and the song is nearly done. Beneath §YM'lyeh§! the sea floor has begun to rise: black stone coming up through the silt, towers and stairs and doors built to no human measure - the city every sleeper on the continent has walked in their dreams since §Y$mltd_the_grand_ritual$§!. It has a name older than any the tribe has given it, and when it breaks the surface the whole world will learn it."
  mltd_rlyeh_rises_states_tt:0 "Controls at least §Y300§! states"
  mltd_ending_the_dreamer_wakes:0 "The Dreamer Wakes"
  mltd_ending_the_dreamer_wakes_desc:0 "At the heart of the risen city there is a door, carved from a single slab as broad as a harbour and sealed since before there were men. Behind it the Dreamer lies in its house, and every god and gift the tribe has ever known was only the leavings of its sleep. §Y[MLT_MLULU.GetName]§! has come down from her tower to the lintel. One word from her and the door falls open. Then every ritual the tribe has ever sung will be answered at once, by the thing they were all written for - and the world will grow free and wild and beyond good and evil, all men shouting and killing and revelling in joy."
  mltd_ending_the_priestess_reigns:0 "The Priestess Reigns"
  mltd_ending_the_priestess_reigns_desc:0 "The door can stay shut. That is not dead which can eternal lie, and a god that sleeps is a patient god. §Y[MLT_MLULU.GetName]§! need not wake it to rule in its name: she can stay where the oracles always promised she would stand, on the highest tower of the risen city, and sing it back down into its dreaming, and hold the world it dreams in her own claws. The Coral Court will count the tithes, the oracles will keep a temple on every river, and the tide will come in when she wills it. A thousand years she will reign."
  mltd_ending_return_to_the_sea:0 "Return to the Sea"
  mltd_ending_return_to_the_sea_desc:0 "The faithful were born dry, but they need not die so: the pools beneath the risen city are deep enough now for the whole tribe, and the changed ones are already walking into the surf by the thousand and coming back up with gills. Let §Y[MLT_MLULU.GetName]§! lead her people down the long stairs into the green dark, where there is no toll and no hunger, where the pools never empty and the children never stop coming - and let whatever rises from the deep to keep those stairs be larger than anything the dry world has ever seen."
  mltd_return_to_the_sea_leviathans_tt:0 "If we still hold §Y$VICTORY_POINTS_7064$§! when the focus completes, a §Y$mltd_leviathan$§! surfaces there, and then another beside it: two capital ships with no parts to fit, that burn no energy cells and can never be built - only summoned"
  mltd_return_to_the_sea_no_mireport_tt:0 "We do not hold §Y$VICTORY_POINTS_7064$§!, so no §Y$mltd_leviathan$§! surfaces unless it is ours again when the focus completes: the deep has nowhere else to bring them ashore"
  mltd_the_dreamer_wakes:0 "$mltd_ending_the_dreamer_wakes$"
  mltd_the_dreamer_wakes_desc:0 "The door is open. The Dreamer walks the world in its own flesh, and everything that marches under the tide's banner marches with its strength. Nothing that lives in its shadow sleeps easily - not even the faithful."
  mltd_the_priestess_reigns:0 "$mltd_ending_the_priestess_reigns$"
  mltd_the_priestess_reigns_desc:0 "The Dreamer sleeps, and the priestess-queen rules in its name from the highest tower of the risen city. The tithes are paid on every river, the temples never close, and no one in the drowned kingdom wants for anything, because no one in it wants anything but what she wills."
  mltd_the_return_to_the_sea:0 "$mltd_ending_return_to_the_sea$"
  mltd_the_return_to_the_sea_desc:0 "The faithful have gone down the long stairs into the pools of the risen city, and they come back up changed, and in numbers. The spawning never stops now: every tide brings more of the children ashore, and the brood-pools hatch the host faster and cheaper than any forge in the dry world can arm one."
  mltd.70.t:0 "$mltd_rlyeh_rises$"
  mltd.70.d:0 "It began at the turn of the tide. The sea around §oM'lyeh§! drew back further than any tribesman had ever seen it go - past the coral gates, past the spawning pools, past the reef off §o$VICTORY_POINTS_7064$§! where the great ones sleep - and it did not come back. Where it had been, something was coming up. Black stone first, streaming weed and silt; then towers, and stairs too broad for any foot, and walls whose angles slide away from the eye, all of it lit green from within and cold as the trench. By the third dawn it stood over the old harbour like a mountain, and §o[MLT_MLULU.GetName]§! stood on its highest tower, exactly as the oracles had promised.\n\nThe tribe had called its city M'lyeh, because that was all a tribesman's throat could say. The oracles now teach the name the stones themselves remember: §cR'lyeh§!. At its heart there is a door, sealed since before there were men, and behind the door §csomething is breathing§!. §o[MLT_MLULU.GetName]§! has not yet said what she will do with it."
  mltd.70.a:0 "In its house at R'lyeh the Dreamer waits dreaming."
  mltd.71.t:0 "A City Out of the Sea"
  mltd.71.d:0 "The first report came from a salvage crew working the wrecks off the northern coast, and nobody believed it: cliffs where there had been open water, black and streaming with weed, and a city on top of them. Then every radio set on the continent that still worked began to pick up the same sound on every band at once - not a voice, and not static, but something like §cbreathing§!, slow and enormous and patient. The sailors who have seen the city up close will not describe it. The few who try speak of angles that are wrong, of stairs no man could climb, and of a great carved door at its heart. The crab-worshippers of §o[MLT.GetNameDef]§! call it §cR'lyeh§!, and they say their queen stands on its highest tower. Every army still standing between the mountains and the sea has turned to face the west."
  mltd.71.a:0 "Then the dreams were never dreams."
  mltd.72.t:0 "$mltd_ending_the_dreamer_wakes$"
  mltd.72.d:0 "§o[MLT_MLULU.GetName]§! opened the door herself. The oracles who waited below the tower say it took her a whole night to speak the word, and that when it was spoken the carved slab did not swing so much as §cfall inward§!, like a stone dropped into deep water. What came out filled the doorway, and then the sky above it. It lifted her from the tower as a child lifts a doll, gently, and set her upon its brow, and since that morning she has spoken with its voice - or it with hers; the Coral Court can no longer tell, and has stopped asking.\n\nThe dream is over. Every sleeper on the continent woke at the same moment, screaming, and the ones who have stopped screaming have begun to sing. Everything that ever slept beneath the sea is awake now, and it is §chungry for the land§!. The world has become what the drowned tablets promised - free and wild and beyond good and evil, all men shouting and killing and revelling in joy."
  mltd.72.a:0 "Iä! Iä! The Dreamer wakes!"
  mltd.73.t:0 "$mltd_ending_the_priestess_reigns$"
  mltd.73.d:0 "§o[MLT_MLULU.GetName]§! did not open the door. She stood before it all night with her claws on the carved slab, singing, and by dawn the breathing behind it had slowed to the long, deep rhythm of a sleeper who will not wake for an age. §cThat is not dead which can eternal lie§! - and a god that dreams is a god that can be ruled for. She has not come down from the tower since, and the whole world has had time to see her there.\n\nThe Coral Court has become a government. Its oracles sit as governors in the conquered towns, its tithe-boats work every river from the Sound to the Rio Grande, and its census-takers have run out of numbers for the souls beneath the tide. The temples never close. No one in the drowned kingdom wants for anything, because no one in it wants anything but what she wills. The oracles have stopped counting her years: a thousand she will reign, they say, and then another thousand, while the Dreamer sleeps below and §cdreams her kingdom for her§!."
  mltd.73.a:0 "A thousand years she will reign!"
  mltd.74.t:0 "$mltd_ending_return_to_the_sea$"
  mltd.74.d:0 "At the next new moon the tribe went down to the water. Not all of it at once: the old and the dry-born lingered on the shore, and the soldiers stayed at their posts inland. But the changed ones went, and the young, and the brood-mothers, walking down the long stairs of the risen city into the green dark with their eyes open, singing as they went. §o[MLT_MLULU.GetName]§! led them. She has not come back up, and she will not: §cthe deep is her house now§!, and she reigns there over halls no dry eye will ever see.\n\nBut her people come back. Every tide brings them ashore in greater numbers than it took them - gilled, cold, tireless, with the long patience of the sea in their eyes - and far out, where the water is blackest, things larger than any ship have begun to rise. The land was only ever a shore. The sea has waited a long time for its children to come home, and it is in no hurry. §cIt will have the rest of the world in time.§!"
  mltd.74.a:0 "The sea calls its children home."

  ### Round 28: the invitations - Terms for the Citadel (mltd_act3_focus.txt), the odds at the end of each invitation's description (scripted loc GetMltdBrkOdds / GetMltdBdtOdds / GetMltdWbhOdds), the refusals' war goals and events mltd.32-34
  # Terms for the Citadel (mltd_act3_focus.txt)
  mltd_wbh_terms_for_the_citadel:0 "Terms for the Citadel"
  mltd_wbh_terms_for_the_citadel_desc:0 "Of all the powers of the north, only the men in steel would sooner die than kneel to a drowned queen, and their Codex says so in as many words. Yet our eyes in the Sound have seen what the Codex will not admit: the chapter is small, its wars are many, and the tide is rising around its walls. Send envoys to the Citadel under a white rag - with the faithful inside its walls, its Civilian Infiltration in our hands and our network over its Sound - and offer the Brotherhood a seat in §Y$mltd_drowned_covenant$§!, steel and salt side by side. It is the long road, and there is no walking it back if they spit on it.\n\n[GetMltdWbhOdds]"
  mltd_wbh_terms_brotherhood_tt:0 "The Brotherhood in Washington - §Y[WBH.GetNameDef]§!, or §Y[TCA.GetNameDef]§! once it has taken their place - is at peace with us, is no one's subject, and sits in no faction or leads its own"
  mltd_wbh_terms_faithful_tt:0 "In that Brotherhood: the cult of §YM'lyeh§! stands at §Y40%§! or more, we hold its §YCivilian Infiltration§! and our network covers more than §Y25%§! of it"
  mltd_wbh_terms_no_covenant_tt:0 "[BRK.GetNameDefCap] have not sworn to §Y$mltd_drowned_covenant$§!: the Brotherhood will not share a table with raiders"
  mltd_wbh_terms_offer_tt:0 "The Brotherhood in Washington is invited to join our faction, §Y$mltd_drowned_covenant$§!."
  mltd_wbh_terms_if_accepted_tt:0 "If it accepts:"
  # 2026-09-24 (the user: too much text): the invitations' answers are two headers over the answer's own native lines -
  # the faction, the join, the war goal. Shared by the Covenant and Hail; the "a year" repeats create_wargoal's expire = 365
  # in mltd.21 and .24 option b (and Terms' in mltd.32 option b)
  mltd_invitation_if_accepted_tt:0 "If they accept:"
  mltd_invitation_if_refused_tt:0 "If they refuse (the war goal §Rexpires after a year§!):"
  mltd_wbh_terms_if_refused_tt:0 "If it refuses (the war goal §Rexpires after a year§!):"
  # Terms for the Citadel's acceptance: the one effect its native lines cannot show (mltd_wbh_join_the_covenant drops the claims)
  mltd_wbh_terms_claims_tt:0 "It gives up every claim it holds on our land"
  # 2026-09-25: a Brotherhood that leads a faction brings its members over (mltd_wbh_join_the_covenant); the focus names the one that would be asked, the event its ROOT
  mltd_wbh_terms_faction_wbh_tt:0 "Every other member of §Y[WBH.GetFactionName]§! at peace with us and our allies leaves it with the Brotherhood and joins ours"
  mltd_wbh_terms_faction_tca_tt:0 "Every other member of §Y[TCA.GetFactionName]§! at peace with us and our allies leaves it with the Brotherhood and joins ours"
  # the refusal options' war goal (mltd.21 option b, mltd.24 option b, mltd.32 option b); vanilla's own wording, BUL_total_war_wargoal_expires_tt
  mltd_refusal_wargoal_expires_tt:0 "War goal expiration time: §R365 days§!"
  # the exclusivity gates (spec section 2)
  mltd_brk_no_brotherhood_table_tt:0 "The Brotherhood in Washington has not sworn to §Y$mltd_drowned_covenant$§!: the raiders will not sit at its table"
  # the odds (scripted loc GetMltdBrkOdds, GetMltdBdtOdds, GetMltdWbhOdds; spec section 3) - they restate the events' ai_chance
  mltd_brk_odds_gone:0 "§YNo one is left to refuse us: [BRK.GetNameDef] are gone, or already ours.§!"
  mltd_brk_odds_human:0 "§YA human chief speaks for [BRK.GetNameDef]: the answer is theirs alone.§!"
  mltd_brk_odds_historical:0 "§YThe raiders will take the offer.§!"
  mltd_brk_odds_unhistorical:0 "§YThe raiders are as likely to take the offer as to spit on it.§!"
  mltd_bdt_odds_human:0 "§YA human king leads [BDT.GetNameDef]: the answer is theirs alone.§!"
  mltd_bdt_odds:0 "§YThe dancers will take the offer.§!"
  mltd_wbh_odds_none:0 "§YNo free Brotherhood holds Washington to hear our terms.§!"
  mltd_wbh_no_brotherhood_tt:0 "No Brotherhood holds Washington - neither [WBH.GetNameDef] nor [TCA.GetNameDef] as the Northwestern Brotherhood"
  mltd_wbh_odds_human:0 "§YA human speaks for the Brotherhood in Washington: the answer is theirs alone.§!"
  mltd_wbh_odds_historical:0 "§YThe Brotherhood will refuse. Its Codex has no line for kneeling to a drowned queen.§!"
  mltd_wbh_odds_tca:0 "§Y[TCA.GetNameDefCap] will almost certainly refuse; perhaps one chapter in ten would listen.§!"
  mltd_wbh_odds_wbh:0 "§Y[WBH.GetNameDefCap] might as easily listen as refuse.§!"
  # events mltd.32-34 (Act III's decade)
  mltd.32.t:0 "Terms from the Deep"
  mltd.32.d:0 "They came to §o[ROOT.Capital.GetName]§! under a white rag, wet to the waist and in no hurry, and stood before the gate until the sentries stopped pretending not to see them. Their message was for the Elders alone: §o[FROM.GetNameDefCap]§! will not come north with fire. It offers the Brotherhood, and every friend who comes with it, a seat in §c$mltd_drowned_covenant$§!, steel and salt side by side, and every shore from the Sound to the strait held in common.\n\nThe Paladins want the envoys shot. The Scribes want to know how a mirelurk learned to write."
  mltd.32.a:0 "The Codex can bend. Give them their seat."
  mltd.32.b:0 "We do not treat with abominations."
  mltd.33.t:0 "The Citadel Opens Its Gates"
  mltd.33.d:0 "The Elders of §o[FROM.GetNameDef]§! argued through the night, and at dawn the gates of §o[FROM.Capital.GetName]§! opened. A Paladin in scarred steel walked down to the water and took the hand of a thing that should not have had one, and the Scribes wrote it all down.\n\n§c$mltd_drowned_covenant$§! has a Brotherhood in it now. §o[BRK.GetNameDefCap]§! will never sit at the same table - but the raiders were never going to keep their word."
  mltd.33.a:0 "Steel and salt, one tide."
  mltd.34.t:0 "The Codex Answers"
  mltd.34.d:0 "Our envoys came back without their white rag. The Elders of §o[FROM.GetNameDef]§! had a passage of their Codex read aloud to them - the one about abominations - and then set the Paladins loose on the beach. Not every envoy swam fast enough.\n\nThe insult gives us cause against them, but not for long: §cwithin the year§! we must carry our answer to their gates, or let it go."
  mltd.34.a:0 "Then the tide will go to them."

  ### Round 28 (restructured in round 28c): the spoils, ten optional focuses in four groups, none chained (common/national_focus/mltd_spoils_focus.txt, ideas in common/ideas/mltd_ideas.txt); their round-28b/28c tooltips and ideas follow the section
  # The north, after Act III's close
  mltd_spoils_the_scribes_vaults:0 "The Scribes' Vaults"
  mltd_spoils_the_scribes_vaults_desc:0 "Beneath the citadels of [84.GetName] and [37.GetName], [WBH.GetNameDef] and [TCA.GetNameDef] hoarded the old world's learning: shelf upon shelf of holotapes, schematics and circuit boards, sealed against rust and heresy alike and tended by generations of scribes. The knights who guarded the vaults are dead, drowned or fled. The scribes are still there. They were never soldiers, and they are finding, to their quiet horror, that the Coral Court asks of them only what their Codex asked: to copy, to catalogue and to obey. The towns of the north watch their old masters bow, and learn to bow as well."
  mltd_spoils_the_drowned_sound:0 "$mltd_the_drowned_sound$"
  mltd_spoils_the_drowned_sound_desc:0 "The north is ours, from the Sound to the dry hills beyond the mountains, and it has stopped fighting. East of the passes, the mines around [332.GetName] and [71.GetName] that once fed the armouries of half the north are flooding - slowly, deliberately, with water piped over the mountains from the Sound - and the ore comes up wet and salted to forges the tribe has lit again. In the old citadels the workshops hammer for the tide and the scribes keep their ledgers in the Coral Court's name, and towns that burned mutants in their squares a generation ago now leave fish on the shore at dusk for things they do not name. The north is the first of the conquered lands to become simply a part of the kingdom. It will not be the last."
  mltd_spoils_sound_states_tt:0 "Controls at least §Y80§! states"
  mltd_the_drowned_sound:0 "The Drowned Sound"
  mltd_the_drowned_sound_desc:0 "The north is the tribe's own. Its scribes copy for the Coral Court, its workshops are rebuilt for the deep, and the conquered towns along the Sound long ago stopped resisting."
  # California, after Act IV's close
  mltd_spoils_the_canals_run_salt:0 "Salt in the Canals"
  mltd_spoils_the_canals_run_salt_desc:0 "For a century [NCR.GetNameDef] lived on its canals: old-world aqueducts and brahmin-dug ditches that carried the northern rivers south to the orchards around [253.GetName]. The Republic's engineers kept that water sweet. Our own engineers let the sea in. They open the sluices to the tide a little at a time, and every season the ditches taste more of brine. The orchards wither and kelp grows in their place, and the brood follows the salt inland until every canal from the coast to the desert has nests in its banks. The farm towns along the water have stopped asking whose flag flies over the pumping stations. They cut the kelp at dawn, leave the nests alone, and sing while they work."
  mltd_spoils_the_foundries_relit:0 "The Foundries Relit"
  mltd_spoils_the_foundries_relit_desc:0 "When [NCR.GetNameDef] broke, its foundries broke with it. Half the furnaces of [350.GetName] were gutted in the fighting, and the Rangers stripped the rest as they fell back: they would sooner leave us ashes than fire. But the city was built on the bones of an older one, and the older one stood beside the sea, and the deep has always had patience for ruins. Salvage crews in brine-stiff robes are relighting the furnaces one by one, in [350.GetName] and in [253.GetName], and the tide has not stopped at the Republic's old border: the [SHI.GetAdjective] works at [163.GetName], which never answered to the Republic at all, are being relit too. The smoke that rises over them all now drifts north, toward §YM'lyeh§!."
  mltd_spoils_the_drowned_harvest:0 "$mltd_the_drowned_harvest$"
  mltd_spoils_the_drowned_harvest_desc:0 "California was the Republic's larder. Now it is ours. Every week the brahmin trains come north along the coast road loaded with grain, dried kelp and salted meat, and every week the towns that load them grow a little quieter, a little more patient, a little more like the villages along our own shore. The farmers no longer pray for rain. They pray for the tide."
  mltd_spoils_harvest_states_tt:0 "Controls at least §Y120§! states"
  mltd_the_drowned_harvest:0 "The Drowned Harvest"
  mltd_the_drowned_harvest_desc:0 "The fields and canals of California feed the tribe now, and the towns that tend them are learning the tide's hymns faster than they ever learned the Republic's laws."
  # The interior, after Act V's close
  mltd_spoils_the_legions_armouries:0 "The Legion's Armouries"
  mltd_spoils_the_legions_armouries_desc:0 "[CES.GetNameDefCap] kept its weapons the way it kept its slaves: counted, chained and under guard. The guards are gone. In the armouries beneath [520.GetName] the racks still stand, row on row of machetes, rifles and bolted-together field guns, every one stamped with the Bull. The tribe has little use for rifles now. The faithful wade through the flooded galleries with lanterns, carry the racks out whole and feed them to the furnaces, and the Bull's steel comes back out as barbed harness and shell-plate for the brood. The Legion's overseers, who have nobody left to answer to, are offered a choice between the pens and the Order. Most of them choose the Order, and the towns they kept in line stay in line."
  mltd_spoils_the_iron_tithe:0 "$mltd_the_iron_tithe$"
  mltd_spoils_the_iron_tithe_desc:0 "Every town between the Colorado and the Rio Grande once paid its tithe to Mars: grain, iron and sons. The tithe is still paid. The wagons still roll to the collection points on the old Legion roads, the tally-men still count every ingot twice, and the iron still goes to the forges of [520.GetName], [518.GetName] and [522.GetName], where the smiths who learned their craft in chains never left their anvils, because nobody told them to stop. We have told them to go on. The furnaces burn day and night again, and the only thing that has changed is the mark struck into the steel: not the Bull, but a crown of coral. The towns keep their own order, because the Legion taught them long ago what disorder costs."
  mltd_spoils_tithe_states_tt:0 "Controls at least §Y180§! states"
  mltd_the_iron_tithe:0 "The Iron Tithe"
  mltd_the_iron_tithe_desc:0 "The interior pays the tribe what it once paid Mars. The Legion's forges burn for the deep, and the towns that fed its armies keep their own order out of long habit."
  # The south, after Act VI's close
  mltd_spoils_the_black_water_wells:0 "The Black Water Wells"
  mltd_spoils_the_black_water_wells_desc:0 "The derricks still stand in their thousands around [892.GetName] and [921.GetName], rusted to the colour of dried blood, and some of them still pump. Oil is of little use to a tribe whose army swims. The deepest wells are another matter: the Texans sank them past the oil into the black water beneath, then capped them with concrete and chained them shut. Our engineers are unchaining them, and the black water goes north in sealed drums to the Coral Court. The priestesses drink it at the new moon and sleep for three days, and when they wake they draw what they have seen: engines no living smith has built, and schematics of the old world copied line for line from nowhere. The scribes cannot explain it. They have learned not to try."
  mltd_spoils_the_salt_road:0 "$mltd_the_salt_road$"
  mltd_spoils_the_salt_road_desc:0 "From the Gulf to the Sound, one road now runs the length of the continent: the old interstates, patched with salvage and marked every mile with a cairn of coral. It starts at the water. The old world's dry docks still line the bays from [799.GetName] to [880.GetName], half-sunk and roofed with gulls; the Texans never had the steel to fill them, and the tribe has no need of hulls. Their gates are opened to the Gulf instead, the brood-mothers are carried south in tanks of seawater, and every dock on the coast becomes a spawning pen, warm and still and deep. Oil, steel and grain move north along the road, and the brood with them; priests, overseers and the tribe's patient law move south. The caravan-masters call it the Salt Road, for the white crust that forms on everything that has travelled it, and every conquered town it touches becomes, in time, another village of §YM'lyeh§!."
  mltd_spoils_salt_road_states_tt:0 "Controls at least §Y250§! states"
  mltd_the_salt_road:0 "The Salt Road"
  mltd_the_salt_road_desc:0 "One road binds the drowned lands together. Its tolls fill the tribe's coffers, its caravans spare the tribe's own workshops, and every town along it lies a little closer to the sea than it did."

  ### Round 28b/28c: the spoils' effect tooltips (each number repeats mltd_spoils_focus.txt beside it), The Office of Salt and Industry (California's fourth, round 28c) and the spoils' two timed ideas (common/ideas/mltd_ideas.txt)
  # the north: The Scribes' Vaults, and The Drowned Sound's works (Beyond the Cascades', merged in round 28c)
  mltd_spoils_scribes_compliance_tt:0 "Every state we hold that is a core of [WBH.GetNameDef], [TCA.GetNameDef] or [BDT.GetNameDef]: §G+10§! $COMPLIANCE$"
  mltd_spoils_cascades_works_tt:0 "In each of §Y[332.GetName]§! and §Y[71.GetName]§! that we hold: §G+1§! shared building slot and §G+1§! [GetMltdArmsFactoryName], built at once"
  # California: Salt in the Canals, The Foundries Relit, and The Office of Salt and Industry with its idea
  mltd_spoils_canals_compliance_tt:0 "Every state we hold that is a core of [NCR.GetNameDef]: §G+10§! $COMPLIANCE$"
  mltd_spoils_canals_hatch_tt:0 "The brood hatches in the salted canals: §G+10§! [GetMltdMirelurksName] of the best breed we have for every state we hold that is a core of [NCR.GetNameDef]"
  mltd_spoils_foundries_works_tt:0 "In each of §Y[350.GetName]§!, §Y[253.GetName]§! and §Y[163.GetName]§! that we hold: §G+1§! shared building slot and §G+1§! [GetMltdCivilianFactoryName], built at once"
  mltd_spoils_the_office_of_salt:0 "$mltd_the_office_of_salt$"
  mltd_spoils_the_office_of_salt_desc:0 "$osi_research_pact$ was the pride of [NCR.GetNameDef]: a bureau of engineers and doctors who taught in the universities of [135.GetName] and [1.GetName] and meant to rebuild the old world with slide rules. Most of them are still there. The laboratories were never burned - the tribe had no reason to burn them - and the Coral Court has found that a scientist who has watched the tide come in over [253.GetName] works as hard for a new master as for the old one, and asks fewer questions. A scribe with a sense of humour, or none at all, has repainted the sign over the door. The work goes on."
  mltd_the_office_of_salt:0 "The Office of Salt and Industry"
  mltd_the_office_of_salt_desc:0 "The scientists of [NCR.GetNameDef] work for the Coral Court now, in the same laboratories and for the same rations, and nobody has asked for the old sign back."
  # the interior: The Legion's Armouries and its timed idea (365 days), and The Iron Tithe's works (The Forges of the Bull's, merged in round 28c)
  mltd_spoils_armouries_resistance_tt:0 "Every state we hold that is a core of [CES.GetNameDef]: §G-10§! $RESISTANCE$"
  mltd_spoils_forges_works_tt:0 "In each of §Y[520.GetName]§!, §Y[518.GetName]§! and §Y[522.GetName]§! that we hold: §G+2§! shared building slots and §G+2§! [GetMltdArmsFactoryName]s, built at once"
  mltd_the_legions_steel:0 "The Legion's Steel"
  mltd_the_legions_steel_desc:0 "The Legion's racks go into the furnaces and come out as barbed harness and shell-plate for the brood. While the Bull's steel lasts, the tribe's creatures go to war better armoured."
  # the south: The Salt Road's hatch (The Gulf Yards', merged in round 28c), and The Black Water Wells' timed idea (365 days)
  mltd_spoils_gulf_hatch_tt:0 "The brood hatches in the flooded dry docks: §G+200§! [GetMltdMirelurksName] of the best breed we have for each of §Y[799.GetName]§!, §Y[903.GetName]§!, §Y[904.GetName]§! and §Y[880.GetName]§! that we hold"
  mltd_the_black_water_visions:0 "Black Water Visions"
  mltd_the_black_water_visions_desc:0 "The priestesses of the Coral Court drink the black water of the Texan wells and wake knowing things no one taught them. The scribes copy down every drawing, and the tribe's work runs faster while the drums last."

  ### Round 28b/28c: the event previews of the Kingdom, Call of the Deep Ones and The Deep Ones Walk, Act II's thefts, The Tide-Wall's works, and The Coast Goes Under (the override, mltd_act2_focus.txt, mltd_act3_focus.txt)
  # the lead-in before an effect_tooltip of the event's option (a focus preview names an event only by its title)
  mltd_event_brings_tt:0 "\n§YThe event brings:§!"
  # Act II's thefts over hidden effects; the amounts repeat mltd_wbh_the_drowned_knights (600 / 1,200, 60 / 120) and mltd_bdt_the_dancers_hear_the_tide (600 / 1,200, else +25)
  mltd_wbh_knights_theft_tt:0 "From the Brotherhood that holds Washington - §Y[WBH.GetNameDef]§!, or §Y[TCA.GetNameDef]§! once it has taken their place - unless it is our ally or our subject, the drowned knights carry off §G600§! infantry equipment if it holds more than §Y1,200§!, and §G60§! power armour if it holds more than §Y120§!"
  mltd_bdt_bone_road_theft_tt:0 "On the bone road the faithful take §G600§! infantry equipment from §Y[BDT.GetNameDef]§! if they hold more than §Y1,200§! and are neither our allies nor our subjects; otherwise §G+25§! §HPolitical Power§!"
  # The Tide-Wall's bunkers (level 2, then 1 in three more provinces, as its add_building_construction lines) and its claim removal; GetMltdBunkerName is OWB's "Outpost", a replace/ key
  mltd_wbh_tide_wall_bunkers_tt:0 "§Y[235.GetName]§! is walled at once while it is still ours: §Y[GetMltdBunkerName]§! level §G2§! in one province, level §G1§! in the other three"
  mltd_wbh_tide_wall_claims_tt:0 "The Brotherhood in Washington gives up any claim it holds on §Y[235.GetName]§!"
  # The Coast Goes Under (Act III, round 28c): the Broken Coast's war twin, mutually exclusive both ways with The Drowned Covenant; a war, so no odds line
  mltd_brk_the_coast_goes_under:0 "The Coast Goes Under"
  mltd_brk_the_coast_goes_under_desc:0 "No gift will ever tame §Y[BRK.GetNameDef]§!. The raiders count their wealth in slaves and longships, and in their drinking halls they laugh at a queen who lives beneath the water. Let them laugh. Our faithful among the crews know which harbours sleep unguarded and which hulls are rotten below the waterline, and the drowned already wait under every jetty from the Sound to the strait. There will be no covenant - only the tide, and a coast gone under it."

  ### Round 28b/28c: Acts IV-VI - the thefts, paid in mirelurks (mltd_act4_focus.txt ... mltd_act6_focus.txt); one line each since 2026-09-24, when the conditional side branches of the war focuses (the Hoover outcome, Caesar's health, Lost Hills' quarrel, the White Legs' gods, the Utah war's gleanings, the Frogs, Tlaloc's heirs) and the thefts' floors went. A fifth or a quarter, the 100 and the 5 repeat the focuses' literals
  # Act IV: Salt on the Caravan Roads
  mltd_ncr_caravan_theft_tt:0 "A fifth of the infantry and support equipment in the depots of §Y[NCR.GetNameDef]§! (each holding at least §Y100§!) - §Y[?mltd_theft_infantry|0]§! and §Y[?mltd_theft_support|0]§! today - paid to us as §G+[?mltd_theft_brood|0]§! mirelurks of our best breed, one for every §Y5§! pieces"
  # Act V: The Sea Against Mars - the crates
