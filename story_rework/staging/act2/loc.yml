  mltd_wbh_the_drowned_knights_desc:0 "§Y[WBH_THE_IMMORTAL.GetName]§! suffers no mutant in his halls, but he keeps slaves, and slaves dream - of green water, and of a city beneath it. Our oracles have taught the dreamers what to murmur at the forges, and now the Inquisitors smell heresy in every corridor of the citadel and feed their own to the pyres. While they burn, the deep gives back what it has kept. Power armour does not float: every Paladin who ever slipped from a [84.GetName] pier went to the bottom still sealed in his steel, and the $mltd_deep_ones$ have been dragging them up out of the silt - rust-black, crusted with barnacles, and filled with something that is no longer quite a man. By night these drowned knights walk back into [84.GetName] through doors the dreamers leave unbarred, and carry [WBH.GetAdjective] weapons down into the water."
  mltd_brk_salt_on_the_broken_coast_desc:0 "The whole wasteland spits on §Y[BRK.GetNameDef]§!: raiders, slavers, wreckers who live off whatever the grey sea throws onto their rocks. We do not spit. The sea that feeds them is ours, and their longships already cross water where our children swim. Envoys with wet hands and quiet voices will sail north with gifts of salt and pearls, and priests will sail with them. Raiders drown; it is the one thing every crew knows for certain about its own end. Our priests will teach them that drowning is not an end at all - and the men who went over the side and came back, coughing, changed, their eyes gone dark, will preach it on the decks for us."
  mltd_brk_the_deep_ones_sail_north_desc:0 "The raiders fight on every shore at once, and they are losing men faster than their shacks can breed them. We can spare what they cannot. Let our warriors and the $mltd_deep_ones$ swim north under the raiders' keels as volunteers and come ashore wherever [BRK.GetNameDef] point their axes, fighting in their name, for their coast - and when one of the $mltd_star_spawn$ wades out of the strait onto an enemy beach behind them, the raiders will not need to be told whose god fights at their side. A people who owe us their victories will not easily forget whose children won them."
  mltd_brk_volunteer_size_6_tt:0 "We may send §G6§! more volunteer divisions to countries at war - [BRK.GetFlag]§Y[BRK.GetNameDef]§! first among them - with no world tension needed (§Y$mltd_brk_volunteers$§!)"
  mltd_bdt_the_dancers_hear_the_tide_desc:0 "Their drums keep the time of marching feet. Our priests have begun to beat a slower rhythm beneath it - the rhythm of water on stone - and some of the dancers have started to keep that time instead. They dream of a drowned hall and a crown of coral, and they wake still dancing. The faithful among them know where the bone road runs, too: it carries every gun [BDT.GetNameDef] own, close enough to the water that a crate can go missing between one painted skull and the next. Whether we end as their allies or their heirs, those crates are better in our hands."
